#################################################################################
#                               OneBranch Pipelines                             #
# This pipeline was created by EasyStart from a sample located at:              #
#   https://aka.ms/obpipelines/easystart/samples                                #
# Documentation:  https://aka.ms/obpipelines                                    #
# Yaml Schema:    https://aka.ms/obpipelines/yaml/schema                        #
# Retail Tasks:   https://aka.ms/obpipelines/tasks                              #
# Support:        https://aka.ms/onebranchsup                                   #
#################################################################################

parameters:
  - name: ACL_CUSTOMIZER_PIN
    type: string
    # From microsoft/azure-linux-image-tools branch user/frhuelsz/acl-baremetal.
    default: a7526eb98a57b41b5d4a0789fcf72622e6a8729a

trigger:
  batch: true
  branches:
    include:
      - main

variables:
  - name: ACL_CUSTOMIZER_PIN
    value: ${{ parameters.ACL_CUSTOMIZER_PIN }}

resources:
  repositories:
    - repository: aclImageTools
      type: github
      name: microsoft/azure-linux-image-tools
      endpoint: microsoft
      ref: ${{ parameters.ACL_CUSTOMIZER_PIN }}

    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

    - repository: platform-tests
      type: git
      name: platform-tests

    - repository: platform-pipelines
      type: git
      name: platform-pipelines
      ref: refs/heads/main

    - repository: platform-telemetry
      name: platform-telemetry
      type: git
      ref: refs/heads/main

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates # https://aka.ms/obpipelines/templates
  parameters:
    globalSdl: # https://aka.ms/obpipelines/sdl
      tsa:
        # Break build on SDL failures instead of filing bugs.
        enabled: false # onebranch publish all sdl results to TSA. If TSA is disabled all SDL tools will forced into 'break' build mode.
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)\.config\CredScanSuppressions.json
      policheck:
        break: true # always break the build on policheck issues. You can disable it by setting to 'false'
      # suppression:
      #   suppressionFile: $(Build.SourcesDirectory)\.gdn\global.gdnsuppress
      cg:
        alertWarningLevel: Medium
      codeql:
        compiled:
          # Disable CodeQL at the pipeline level, enable for jobs that build code
          enabled: false
    featureFlags:
      runOnHost: true
      EnableCDPxPAT: false

    stages:
      - template: templates/pipeline-selector.yml
        parameters:
          targetStage: ci
          includeAclTests: true
