parameters:
  - name: dependsOnStage
    type: string
    default: ""

stages:
  - stage: TridentAclAgentTest
    displayName: Validate trident-acl-agent (label protocol + tester)
    ${{ if ne(parameters.dependsOnStage, '') }}:
      dependsOn: ${{ parameters.dependsOnStage }}

    jobs:
      - job: ValidateAclAgent
        displayName: Build and test trident-acl-agent + Go tester
        timeoutInMinutes: 30
        pool:
          type: linux
          name: trident-ubuntu-1es-pool-eastus2
          hostArchitecture: amd64
        variables:
          ob_outputDirectory: /tmp/build
        steps:
          - template: ../common_tasks/checkout_trident.yml
          - template: ../common_tasks/avoid-pypi-usage.yml
          - template: ../common_tasks/update-protoc.yml
          - template: ../common_tasks/rustup.yml
          - template: ../common_tasks/cargo-auth.yml
            parameters:
              cargoConfigPath: $(TRIDENT_SOURCE_DIR)/.cargo/config.toml

          - bash: |
              set -eux
              make bin/trident-acl-agent-tester
              cd tools
              go test ./pkg/acltester/... ./cmd/trident-acl-agent-tester
            displayName: Build and test Go ACL tester
            workingDirectory: $(TRIDENT_SOURCE_DIR)

          - bash: |
              set -eux
              cargo build -p trident-acl-agent
              cargo test -p trident-acl-agent

              if [ -f tools/cmd/trident-acl-agent-tester/e2e-smoke.sh ]; then
                bash tools/cmd/trident-acl-agent-tester/e2e-smoke.sh
              fi
            displayName: Build and test Rust ACL agent
            workingDirectory: $(TRIDENT_SOURCE_DIR)
            env:
              OVERRIDE_RUST_FEED: false
