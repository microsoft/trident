parameters:
  - name: tridentSourceDirectory
    type: string

  - name: imageName
    type: string

  - name: architecture
    displayName: System Architecture
    type: string
    default: "amd64"
    values:
      - arm64
      - amd64

  - name: azureLinuxVersion
    displayName: Version of AzureLinux for the Base Image
    type: string
    values:
      - "2.0"
      - "3.0"
    default: "3.0"

  - name: micBuildType
    displayName: MIC Build Type
    type: string
    values:
      - dev
      - preview
      - release
    default: release

  - name: micVersion
    displayName: MIC Version
    type: string
    default: "*.*.*"

  - name: baseimgBuildType
    displayName: Base Image build type
    type: string
    default: "release"
    # values:
    #   - dev
    #   - preview
    #   - release

  - name: baseimgVersion
    displayName: Base Image Version
    type: string
    default: "*.*.*"

  - name: rpmsVersion
    displayName: RPM Version
    type: string
    default: "*.*.*"

  - name: clones
    type: number
    default: 1
    displayName: Number of clones to create

steps:
  - template: ../common_tasks/avoid-pypi-usage.yml

  - template: ../common_tasks/cargo-auth.yml
    parameters:
      cargoConfigPath: $(TRIDENT_SOURCE_DIR)/.cargo/config.toml

  - template: common/sfi-enforce-isolation-with-etc-hosts.yaml@platform-pipelines

  - script: |
      set -eux

      if which tdnf; then
        # nss-tools provides certutil while pesign provides efikeygen & pesign,
        # which are required for producing a signed image to enable SecureBoot
        sudo tdnf install -y veritysetup nss-tools pesign
        sudo systemctl start docker
      else
        # Ubuntu is used for building and testing of VM images suitable for
        # servicing by Trident
        sudo apt install -y createrepo-c swtpm
      fi
      az extension add --name azure-devops
    displayName: "Install native dependencies"
    retryCountOnTaskFailure: 3

  - bash: |
      set -euo pipefail
      python3 - <<'PY' "${{ parameters.imageName }}"
      import json
      import sys
      from pathlib import Path

      legacy = json.loads(Path("tests/tailor-images/legacy-map.json").read_text())
      entry = legacy[sys.argv[1]]
      print(f"##vso[task.setvariable variable=baseImageType]{entry['baseImage']}")
      PY
    displayName: "Resolve image metadata"
    workingDirectory: ${{ parameters.tridentSourceDirectory }}

  - bash: |
      echo "Image type: $(baseImageType)"
      echo "Defined variables:"
      env | sort
    displayName: "Show defined variables"

  - template: common/mic-download-template.yaml@platform-pipelines
    parameters:
      buildType: ${{ parameters.micBuildType }}
      arch: ${{ parameters.architecture }}
      micVersion: ${{ parameters.micVersion }}
  
# Note: DHCP packages are not being installed in this image template.
# If needed use template download-dhcp.yml on test-images.

  - template: common/base-images-download-template.yaml@platform-pipelines
    parameters:
      buildType: ${{ parameters.baseimgBuildType }}
      baseImageType: $(baseImageType)
      imageVersion: ${{ parameters.baseimgVersion }}
      azureLinuxVersion: ${{ parameters.azureLinuxVersion }}

  # For dev builds, the RPMs are not necessarily published, so download them here. The
  # parameter is set based on a runtime variable, so we cannot use ${{ if }}, so the
  # template is always run and contains logic to skip if not needed.
  - template: common/rpms-download-template.yaml@platform-pipelines
    parameters:
      rpmsVersion: ${{ parameters.rpmsVersion }}
      azureLinuxVersion: ${{ parameters.azureLinuxVersion }}
      runtimeBuildType: ${{ parameters.baseimgBuildType }}

  - ${{ if eq(parameters.architecture, 'arm64') }}:
    - task: DownloadPipelineArtifact@2
      displayName: "Download go-tools for direct-streaming installer"
      condition: or(eq('${{ parameters.imageName }}', 'trident-direct-streaming-installer-amd64'), eq('${{ parameters.imageName }}', 'trident-direct-streaming-installer-arm64'))
      inputs:
        buildType: current
        artifactName: go-tools-arm64
        targetPath: "$(Build.ArtifactStagingDirectory)/go-tools"
  - ${{ if ne(parameters.architecture, 'arm64') }}:
    - task: DownloadPipelineArtifact@2
      displayName: "Download go-tools for direct-streaming installer"
      condition: or(eq('${{ parameters.imageName }}', 'trident-direct-streaming-installer-amd64'), eq('${{ parameters.imageName }}', 'trident-direct-streaming-installer-arm64'))
      inputs:
        buildType: current
        artifactName: go-tools
        targetPath: "$(Build.ArtifactStagingDirectory)/go-tools"

  - bash: |
      set -ex

      # Move base VHDX to artifacts/ (tailor baseImages catalogue points at artifacts/*.vhdx)
      mkdir -p artifacts
      if ls "$(Build.ArtifactStagingDirectory)/images" | grep -q ".*\.vhdx$"; then
        mv $(Build.ArtifactStagingDirectory)/images/*.vhdx artifacts/
        rm -rf $(Build.ArtifactStagingDirectory)/images
      else
        echo "No base image found"
        exit 1
      fi

      # Move dev RPM overrides to artifacts/rpm-overrides/
      if ls "$(Build.ArtifactStagingDirectory)/rpms/" 2>/dev/null | grep -q "rpms.tar.gz"; then
        mkdir -p artifacts/rpm-overrides
        tar -xvf $(Build.ArtifactStagingDirectory)/rpms/rpms.tar.gz \
          --strip-components=2 \
          -C artifacts/rpm-overrides
        rm $(Build.ArtifactStagingDirectory)/rpms/rpms.tar.gz
      fi

      DISTRO=azl3
      if [[ "${{ parameters.azureLinuxVersion }}" == "4.0-preview" ]]; then
        DISTRO=azl4
      fi

      # Move Trident RPMs to bin/RPMS/ (tailor rpmSources point at bin/RPMS/)
      if [ -d "$(Build.ArtifactStagingDirectory)/trident" ]; then
        mkdir -p bin/RPMS
        find "$(Build.ArtifactStagingDirectory)/trident" -name "*${DISTRO}*.rpm" -exec mv {} bin/RPMS/ \;
        rm -rf "$(Build.ArtifactStagingDirectory)/trident"
      fi

      if [[ "${{ parameters.imageName }}" == trident-direct-streaming-installer-* ]]; then
        if [ -f "$(Build.ArtifactStagingDirectory)/go-tools/rcp-agent" ]; then
          cp "$(Build.ArtifactStagingDirectory)/go-tools/rcp-agent" artifacts/rcp-agent
        elif [ -f bin/rcp-agent ]; then
          cp bin/rcp-agent artifacts/rcp-agent
        else
          echo "Missing rcp-agent for direct-streaming installer"
          exit 1
        fi
        chmod +x artifacts/rcp-agent
        cp tools/cmd/rcp-agent/rcp-agent.service artifacts/rcp-agent.service
      fi
    displayName: "Prepare and move requirements"
    workingDirectory: ${{ parameters.tridentSourceDirectory }}

  - bash: |
      set -euo pipefail

      legacy_name='${{ parameters.imageName }}'
      export PATH="$HOME/.cargo/bin:$PATH"
      export CLICOLOR_FORCE=1

      readarray -t selector_lines < <(python3 - <<'PY' "$legacy_name"
      import json
      import sys
      from pathlib import Path

      entry = json.loads(Path("tests/tailor-images/legacy-map.json").read_text())[sys.argv[1]]
      print(entry["image"])
      print(entry["ext"])
      print(entry.get("tailorExt", entry["ext"]))
      for key, value in entry["selectors"].items():
          print(f"{key}={value}")
      PY
      )

      tailor_image="${selector_lines[0]}"
      artifact_ext="${selector_lines[1]}"
      source_ext="${selector_lines[2]}"
      selector_args=()
      if (( ${#selector_lines[@]} > 3 )); then
        for selector in "${selector_lines[@]:3}"; do
          selector_args+=("-s" "$selector")
        done
      fi

      manifest_path=tests/tailor-images/tailor.yaml
      if [[ "${{ parameters.micBuildType }}" == "dev" ]]; then
        manifest_path=tests/tailor-images/.tailor.pipeline.yaml
        python3 - <<'PY'
      from pathlib import Path
      text = Path("tests/tailor-images/tailor.yaml").read_text()
      needle = """toolchains:
        default: ic
        entries:
          - name: ic
            container: mcr.microsoft.com/azurelinux/imagecustomizer
            tag: latest
      """
      replacement = """toolchains:
        default: ic-dev
        entries:
          - name: ic
            container: mcr.microsoft.com/azurelinux/imagecustomizer
            tag: latest
          - name: ic-dev
            container: imagecustomizer
            tag: dev
            pull: never
      """
      Path("tests/tailor-images/.tailor.pipeline.yaml").write_text(text.replace(needle, replacement, 1))
      PY
      fi

      matrix_json=$(cargo run --manifest-path tools/tailor/Cargo.toml --quiet --         --manifest "$manifest_path"         matrix "$tailor_image" --format json "${selector_args[@]}")

      slug=$(python3 - <<'PY' "$matrix_json"
      import json
      import sys
      cells = json.loads(sys.argv[1])
      if len(cells) != 1:
          raise SystemExit(f"expected exactly one cell, got {len(cells)}")
      print(cells[0]["slug"])
      PY
      )

      rm -f tests/tailor-images/artifacts/ca_cert.pem
      cargo run --manifest-path tools/tailor/Cargo.toml --quiet --         --manifest "$manifest_path"         build "$tailor_image"         "${selector_args[@]}"         --output-dir $(ob_outputDirectory)         --clones ${{ parameters.clones }}

      if [[ ${{ parameters.clones }} -eq 1 ]]; then
        mv "$(ob_outputDirectory)/${slug}.${source_ext}" "$(ob_outputDirectory)/${legacy_name}.${artifact_ext}"
      else
        for ((i=0; i<${{ parameters.clones }}; i++)); do
          mv "$(ob_outputDirectory)/${slug}_clone${i}.${source_ext}"              "$(ob_outputDirectory)/${legacy_name}_${i}.${artifact_ext}"
        done
      fi

      if [ -f tests/tailor-images/artifacts/ca_cert.pem ]; then
        cp tests/tailor-images/artifacts/ca_cert.pem "$(ob_outputDirectory)/ca_cert.pem"
      fi

      rm -f tests/tailor-images/.tailor.pipeline.yaml
    displayName: "Build ${{ parameters.imageName }}"
    workingDirectory: ${{ parameters.tridentSourceDirectory }}
