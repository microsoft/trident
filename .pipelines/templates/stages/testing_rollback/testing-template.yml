parameters:
  - name: updateCheckTimeoutInMinutes
    displayName: "Timeout for checking target OS deployment in minutes"
    type: number
    default: 25

  - name: verboseLogging
    displayName: "Enable verbose logging"
    type: boolean
    default: false

  - name: imageOverride
    displayName: "Image override prefix"
    type: string
    default: ""

  - name: platform
    displayName: Test platform
    type: string
    values:
      - qemu

  - name: flavor
    displayName: Image flavor
    type: string
    values:
      - qemu-grub
      - qemu
      - uki

  - name: pool
    displayName: Agent pool
    type: string
    default: "trident-ubuntu-1es-pool-eastus2"

  - name: skipManualRollbackTesting
    displayName: "Skip manual rollback testing"
    type: string
    default: "false"

  - name: micBuildType
    displayName: MIC Build Type
    type: string
    values:
      - dev
      - preview
      - release
    default: release

  - name: micVersion
    displayName: MIC Version
    type: string
    default: "*.*.*"

  - name: testSecureBoot
    type: boolean
    default: true

jobs:
  - job: RollbackTesting_${{ replace(parameters.flavor, '-', '_') }}
    displayName: Rollback Testing - ${{ parameters.flavor }}
    timeoutInMinutes: ${{ parameters.updateCheckTimeoutInMinutes }}
    pool:
      type: linux
      name: ${{ parameters.pool }}
      hostArchitecture: amd64

    variables:
      ob_outputDirectory: /tmp/deployment_logs_${{ parameters.flavor }}
      ob_artifactBaseName: "rollback-testing-${{ parameters.flavor }}"
      TEST_RESOURCE_GROUP: trident-vm-servicing-validation-$(Build.BuildId)
      # Only the dev MIC build overrides the image customizer; every other
      # build type uses storm's default, so the flag is omitted entirely.
      ${{ if eq(parameters.micBuildType, 'dev') }}:
        imageCustomizerFlag: "--image-customizer-image imagecustomizer:dev"
      ${{ else }}:
        imageCustomizerFlag: ""

    steps:
      - template: ../common_tasks/checkout_trident.yml
      - task: DownloadPipelineArtifact@2
        inputs:
          buildType: current
          artifactName: image-${{ parameters.flavor }}-base
          targetPath: "$(Build.ArtifactStagingDirectory)/"
        displayName: Download Base Image

      - task: DownloadPipelineArtifact@2
        inputs:
          buildType: current
          artifactName: image-${{ parameters.flavor }}-update-a
          targetPath: "$(Build.ArtifactStagingDirectory)"
        displayName: Download Update Image

      - task: DownloadPipelineArtifact@2
        inputs:
          buildType: current
          artifactName: ssh-keys
          targetPath: "$(Build.ArtifactStagingDirectory)/ssh"
        displayName: Download SSH Keys

      - task: DownloadPipelineArtifact@2
        displayName: "Download go-tools"
        inputs:
          buildType: current
          artifactName: "go-tools"
          patterns: |
            netlisten
            storm-trident
          targetPath: "$(TRIDENT_SOURCE_DIR)/bin"

      - bash: |
          set -eux
          chmod +x $(TRIDENT_SOURCE_DIR)/bin/netlisten
          chmod +x $(TRIDENT_SOURCE_DIR)/bin/storm-trident
          cp $(Build.ArtifactStagingDirectory)/ssh/id_rsa* ~/.ssh/
          chmod -R 700 ~/.ssh/
          mkdir -p $(ob_outputDirectory)
          ls -l ~/.ssh/
        displayName: Set up SSH Keys and setup output directory

      - template: common/mic-download-template.yaml@platform-pipelines
        parameters:
          buildType: ${{ parameters.micBuildType }}
          arch: amd64
          micVersion: ${{ parameters.micVersion }}

      - bash: |
          set -eux

          sudo ./bin/storm-trident run rollback -a \
            -j $(ob_outputDirectory)/storm-rollback.junit.xml \
            --flavor ${{ parameters.flavor }} \
            --verbose=${{ parameters.verboseLogging }} \
            --secure-boot=${{ parameters.testSecureBoot }} \
            --skip-manual-rollbacks=${{ parameters.skipManualRollbackTesting }} \
            $(imageCustomizerFlag) \
            --artifacts-dir $(Build.ArtifactStagingDirectory) \
            --output-path $(ob_outputDirectory) \
            --platform ${{ parameters.platform }} \
            --ssh-private-key-path $(SSH_PRIVATE_KEY_PATH) \
            --ssh-public-key-path $(SSH_PUBLIC_KEY_PATH) \
            --force-cleanup
        displayName: "Rollback test (${{ parameters.platform }})"
        workingDirectory: $(TRIDENT_SOURCE_DIR)
        timeoutInMinutes: 5

      # storm copies serial-console output verbatim into the JUnit system-out
      # CDATA, which can contain C0 control bytes that XML 1.0 forbids;
      # PublishTestResults@2 rejects the whole file if they survive. Keep the
      # only C0 bytes XML allows (tab/LF/CR) and qualify the empty classname
      # storm emits so the flavors do not collide in the Tests tab. A byte
      # filter is used rather than an XML parser precisely because the document
      # is not well-formed until this runs.
      - bash: |
          set -eu
          JUNIT="$(ob_outputDirectory)/storm-rollback.junit.xml"
          if [ ! -f "$JUNIT" ]; then
            echo "No JUnit file at $JUNIT; skipping sanitization."
            exit 0
          fi
          sudo chown "$USER" "$JUNIT"
          tr -d '\000-\010\013\014\016-\037' < "$JUNIT" > "${JUNIT}.clean"
          mv "${JUNIT}.clean" "$JUNIT"
          sed -i "/<testcase /s/ classname=\"\"/ classname=\"rollback-${{ parameters.flavor }}\"/" "$JUNIT"
        displayName: "Sanitize + qualify JUnit for ADO"
        condition: succeededOrFailed()
        workingDirectory: $(TRIDENT_SOURCE_DIR)

      # Surfaces per-test-case rollback results in the build's Tests tab.
      # Without this the whole stage is a single opaque pass/fail exit code.
      - template: ../junit/handle-junit-test-results.yml
        parameters:
          testRunName: "storm-rollback ${{ parameters.flavor }}"
          junitTestFile: "$(ob_outputDirectory)/storm-rollback.junit.xml"
          displayNameSpecifier: "storm rollback ${{ parameters.flavor }}"
          artifactName: "junit_storm_rollback_${{ parameters.flavor }}"

      - bash: |
          set -eux

          sudo zstd -T0 $(Build.ArtifactStagingDirectory)/booted.qcow2
          sudo mv $(Build.ArtifactStagingDirectory)/booted.qcow2.zst $(ob_outputDirectory)/
        workingDirectory: $(TRIDENT_SOURCE_DIR)
        condition: failed()
        displayName: "Publish logs and OS disk on failure"
        timeoutInMinutes: 5

      - template: ../testing_common/fix-output-directory-for-one-branch-step.yml
        parameters:
          outputDir: $(ob_outputDirectory)
          condition: always()
