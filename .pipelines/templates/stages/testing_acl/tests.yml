stages:
  - stage: BuildAclImages
    displayName: Build ACL images (regular kernel and MSHV)
    dependsOn:
      - GetTridentBinaries_rpms_amd64
      - PrepareSSHKeys
      - BuildingTools
    jobs:
      - template: prepare-image.yml
        parameters:
          variant: standard
      - template: prepare-image.yml
        parameters:
          variant: mshv

  - stage: TestAcl
    displayName: ACL manual A/B updates (Linux QEMU)
    dependsOn: BuildAclImages
    jobs:
      - ${{ each variant in split('standard,mshv', ',') }}:
          - job: AclQemu_${{ variant }}
            displayName: Boot ${{ variant }} ACL image and exercise update/rollback cycle
            timeoutInMinutes: 90
            pool:
              type: linux
              name: trident-ubuntu-1es-pool-eastus2
              hostArchitecture: amd64
            variables:
              ob_outputDirectory: $(Pipeline.Workspace)/acl-${{ variant }}-results
              ob_artifactBaseName: acl-${{ variant }}-results
            steps:
              - template: ../common_tasks/checkout_trident.yml
              - template: ../testing_vm/netlaunch-prep.yml
              - task: DownloadPipelineArtifact@2
                displayName: Download ACL ${{ variant }} image and COSI
                inputs:
                  buildType: current
                  artifactName: acl-${{ variant }}
                  targetPath: $(Build.ArtifactStagingDirectory)/acl
              - task: DownloadPipelineArtifact@2
                displayName: Download storm tool
                inputs:
                  buildType: current
                  artifactName: go-tools
                  patterns: storm-trident
                  targetPath: $(TRIDENT_SOURCE_DIR)/bin
              - task: Bash@3
                displayName: Run ACL update, rollback, update, update with explicit commits
                inputs:
                  targetType: inline
                  workingDirectory: $(TRIDENT_SOURCE_DIR)
                  script: |
                    set -euo pipefail
                    chmod +x ./bin/storm-trident
                    chmod 600 '$(Build.ArtifactStagingDirectory)/acl/id_rsa'
                    mkdir -p '$(ob_outputDirectory)'
                    sudo ./bin/storm-trident run acl -a -- \
                      --variant '${{ variant }}' \
                      --artifacts-dir '$(Build.ArtifactStagingDirectory)/acl' \
                      --output-path '$(ob_outputDirectory)'
              - template: ../testing_common/fix-output-directory-for-one-branch-step.yml
                parameters:
                  outputDir: $(ob_outputDirectory)
                  condition: always()
