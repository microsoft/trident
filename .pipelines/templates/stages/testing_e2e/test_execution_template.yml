parameters:
  - name: hardwareType
    type: string
    values:
      - BM
      - VM

  - name: runtimeType
    type: string
    values:
      - HOST
      - CONTAINER

  - name: testingRun
    type: boolean
    default: false

  - name: maxParallel
    type: string
    default: null

  - name: acrServiceConnectionName
    displayName: "Service connection used to push extension/COSI images to ACR"
    type: string
    default: trident-dev-acr-write-umi-ECF

stages:
  - stage: E2ETesting_${{ parameters.hardwareType }}_${{ parameters.runtimeType }}
    displayName: E2E ${{ parameters.hardwareType }} ${{ parameters.runtimeType }} Testing
    dependsOn:
      - DefineTests_E2E
      - ${{ if eq(parameters.testingRun, true) }}:
          - DownloadTestingElements
          - BuildStormTridentE2E
      - ${{ else }}:
          - BuildingTools
          - ${{ if eq(parameters.runtimeType, 'CONTAINER') }}:
              - BuildTridentContainerImage
              - TridentTestImg_trident_container_installer
              - TridentTestImg_trident_container_testimage
              - TridentTestImg_trident_container_verity_testimage
              - TridentTestImg_trident_container_usrverity_testimage
          - ${{ else }}:
              - TridentTestImg_trident_split_installer
              - TridentTestImg_trident_installer
              - TridentTestImg_trident_testimage
              - TridentTestImg_trident_verity_testimage
              - TridentTestImg_trident_usrverity_testimage
    variables:
      - name: matrixJson
        value: "$[ stageDependencies.DefineTests_E2E.DefineTests.outputs['matrices.TEST_MATRIX_E2E_${{ parameters.hardwareType }}_${{ parameters.runtimeType }}'] ]"

    jobs:
      - job: Testing
        timeoutInMinutes: 50
        pool:
          type: linux
          name: trident-ubuntu-1es-pool-eastus2
          hostArchitecture: amd64

        strategy:
          matrix: $[ variables['matrixJson'] ]
          ${{ if and(parameters.maxParallel, ne(parameters.maxParallel, 'null'), ne(parameters.maxParallel, ''), ne(parameters.maxParallel, 0)) }}:
            maxParallel: ${{ parameters.maxParallel }}

        condition: ne(variables['matrixJson'], '{}')
        variables:
          # Provides: ACR_NAME (used to push/pull extension images).
          - group: trident_e2e_params
          - name: ob_outputDirectory
            value: /tmp/output
          - name: ob_artifactBaseName
            value: $(SCENARIO)_$(System.JobAttempt)
          - ${{ if eq(parameters.runtimeType, 'CONTAINER') }}:
              - name: installerISOName
                value: trident-container-installer
              - name: testImageName
                value: trident-container-testimage
              - name: verityTestImageName
                value: trident-container-verity-testimage
              - name: usrVerityTestImageName
                value: trident-container-usrverity-testimage
              - name: downloadTridentContainer
                value: true
          - ${{ else }}:
              - name: installerISOName
                value: trident-installer
              - name: testImageName
                value: trident-testimage
              - name: verityTestImageName
                value: trident-verity-testimage
              - name: usrVerityTestImageName
                value: trident-usrverity-testimage
              - name: downloadTridentContainer
                value: false

        steps:
          - template: ../common_tasks/checkout_trident.yml
          - template: ../common_tasks/avoid-pypi-usage.yml

          - bash: |
              set -eux
              # The matrix only exposes the full scenario name (e.g.
              # "extensions_vm-host"); derive the configuration name and runtime
              # from it for the per-config handling below.
              config=$(echo "$(SCENARIO)" | sed -E 's/_(vm|bm)-(host|container)$//')
              runtime=$(echo "$(SCENARIO)" | sed -E 's/.*_(vm|bm)-(host|container)$/\2/')
              echo "##vso[task.setvariable variable=tridentConfigurationName]$config"
              echo "##vso[task.setvariable variable=tridentRuntimeEnv]$runtime"
            displayName: "Resolve configuration name from scenario"

          - bash: |
              if [ "$(tridentConfigurationName)" == 'split' ]; then
                splitInstallerIsoName="trident-split-installer"
                echo "setting variable.installerISOName to $splitInstallerIsoName"
                echo "##vso[task.setvariable variable=installerISOName]$splitInstallerIsoName"
              fi
            displayName: Special handle for split test

          # Download all test images
          - template: ../testing_common/download-test-images.yml
            parameters:
              installerISO: $(installerISOName)
              tridentTestImage: ${{ variables.testImageName }}
              tridentTestImageVerity: ${{ variables.verityTestImageName }}
              downloadTridentContainer: ${{ variables.downloadTridentContainer }}
              tridentTestImageUsrVerity: ${{ variables.usrVerityTestImageName }}
              tridentSourceDirectory: $(TRIDENT_SOURCE_DIR)

          # In a testingRun (shortcut) consume the storm-trident built from the
          # branch under test (BuildStormTridentE2E), overriding the possibly
          # stale binary from the go-tools/image download above.
          - ${{ if eq(parameters.testingRun, true) }}:
              - task: DownloadPipelineArtifact@2
                displayName: "Download storm-trident (built from source)"
                inputs:
                  buildType: current
                  artifactName: "storm-trident-e2e"
                  targetPath: "$(TRIDENT_SOURCE_DIR)/bin"
              - bash: |
                  set -eux
                  chmod +x ./bin/storm-trident
                displayName: "Make storm-trident executable"
                workingDirectory: $(TRIDENT_SOURCE_DIR)

          # For the extensions config, build sample sysext images and push them
          # to ACR so Trident can pull them from an OCI registry during install.
          # The config name is only known at runtime (matrix SCENARIO), so these
          # steps branch on it at runtime and no-op for other configs.
          - bash: |
              set -eux
              if [ "$(tridentConfigurationName)" != 'extensions' ]; then
                echo "Configuration is '$(tridentConfigurationName)'; skipping extension image build."
                exit 0
              fi

              ./bin/storm-trident script build-extension-images --build-sysexts --num-clones 2

              # Install ORAS for the ACR push.
              VERSION="1.2.2"
              curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
              mkdir -p oras-install/
              tar -zxf oras_${VERSION}_*.tar.gz -C oras-install/
              sudo mv oras-install/oras /usr/local/bin/
              rm -rf oras_${VERSION}_*.tar.gz oras-install/
            displayName: "Build extension images (extensions only)"
            workingDirectory: $(TRIDENT_SOURCE_DIR)
            retryCountOnTaskFailure: 3

          - task: AzureCLI@2
            displayName: "Push extension images to ACR (extensions only)"
            inputs:
              azureSubscription: ${{ parameters.acrServiceConnectionName }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -eux
                if [ "$(tridentConfigurationName)" != 'extensions' ]; then
                  echo "Configuration is '$(tridentConfigurationName)'; skipping ACR push."
                  exit 0
                fi

                cd $(TRIDENT_SOURCE_DIR)
                # Sets the SYSEXT_REPO and TAG_BASE pipeline variables.
                ./bin/storm-trident script acr-push \
                    --config extensions \
                    --deployment-environment virtualMachine \
                    --acr-name $(ACR_NAME) \
                    --repo-name sysext-$(tridentRuntimeEnv) \
                    --build-id $(Build.BuildId) \
                    --file-paths $(TRIDENT_SOURCE_DIR)/test-sysext-1.raw \
                    --file-paths $(TRIDENT_SOURCE_DIR)/test-sysext-2.raw \
                    --tag-var-name TAG_BASE \
                    --repo-var-name SYSEXT_REPO
            retryCountOnTaskFailure: 3

          - bash: |
              set -eux

              mkdir -p $(ob_outputDirectory)

              # UKI/usr-verity images boot their kernel directly through
              # firmware Secure Boot, so the image signing certificate must be
              # enrolled into the VM's EFI variables via --signing-cert. The
              # cert ships alongside the usrverity test image. Enrolling it is
              # harmless for grub-based images, so pass it whenever present.
              SIGNING_CERT_ARG=""
              CA_CERT_PATH="$(System.ArtifactsDirectory)/usrverity-testimage/ca_cert.pem"
              if [ -f "$CA_CERT_PATH" ]; then
                SIGNING_CERT_ARG="--signing-cert $CA_CERT_PATH"
              fi

              # For the extensions config, point the Host Configuration at the
              # sysext image pushed to ACR above. SYSEXT_REPO and TAG_BASE were
              # set by the acr-push step; ACR_NAME comes from trident_e2e_params.
              EXTENSION_ARGS=""
              if [ "$(tridentConfigurationName)" == 'extensions' ]; then
                sysext_tag="$(TAG_BASE).1"
                sysext_oci_url="oci://$(ACR_NAME).azurecr.io/$(SYSEXT_REPO):${sysext_tag}"
                sysext_sha384=$(sha384sum "$(TRIDENT_SOURCE_DIR)/test-sysext-1.raw" | awk '{print $1}')
                EXTENSION_ARGS="--sysext-oci-url ${sysext_oci_url} --sysext-sha384 ${sysext_sha384}"
              fi

              ./bin/storm-trident run "$(SCENARIO)" \
                  -o $(ob_outputDirectory) \
                  -j "$(ob_outputDirectory)/storm-e2e.junit.xml" \
                  -- \
                  --pipeline-run \
                  --iso "./artifacts/iso/$(installerISOName).iso" \
                  $SIGNING_CERT_ARG \
                  $EXTENSION_ARGS
            displayName: "🧪 Run E2E Test"
            workingDirectory: $(TRIDENT_SOURCE_DIR)

          # Qualify each JUnit testcase's classname with the scenario (which
          # includes the runtime, e.g. base_vm-host). storm emits an empty
          # classname and identical testcase names across runtimes, so ADO's
          # Tests tab (which keys test identity on classname + name) would merge
          # the host and container variants of the same case. A targeted sed on
          # <testcase> lines is used rather than an XML parser because storm
          # embeds raw serial-console control characters in the CDATA that make
          # the document reject strict parsing (ADO's own parser is lenient).
          # Runs even on test failure so the failing XML is still disambiguated.
          - bash: |
              set -eu
              JUNIT="$(ob_outputDirectory)/storm-e2e.junit.xml"
              if [ ! -f "$JUNIT" ]; then
                echo "No JUnit file at $JUNIT; skipping classname qualification."
                exit 0
              fi
              SCENARIO="$(SCENARIO)"
              sed -i "/<testcase /s/ classname=\"\"/ classname=\"${SCENARIO}\"/" "$JUNIT"
            displayName: "Qualify JUnit classnames with scenario"
            condition: succeededOrFailed()
            workingDirectory: $(TRIDENT_SOURCE_DIR)

          # Publish the JUnit XML produced by the storm run (-j above) to the
          # build's Tests tab and as a build artifact. Uses succeededOrFailed()
          # internally so results upload even when the scenario fails (the XML
          # then carries the failures).
          - template: ../junit/handle-junit-test-results.yml
            parameters:
              testRunName: "storm-e2e $(SCENARIO)"
              junitTestFile: "$(ob_outputDirectory)/storm-e2e.junit.xml"
              displayNameSpecifier: "storm E2E $(SCENARIO)"
              artifactName: "junit_storm_e2e_$(SCENARIO)"

          # Delete the extension images pushed to ACR above so runs don't leak
          # images (mirrors the legacy remove-from-acr.yml cleanup). Runs even
          # when the test fails; no-ops for non-extensions configs. The tag base
          # is reconstructed from build id + config + deployment environment
          # (same inputs acr-push used), and SYSEXT_REPO was set by the push
          # step.
          - task: AzureCLI@2
            displayName: "Delete extension images from ACR (extensions only)"
            condition: always()
            retryCountOnTaskFailure: 3
            inputs:
              azureSubscription: ${{ parameters.acrServiceConnectionName }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -eux
                if [ "$(tridentConfigurationName)" != 'extensions' ]; then
                  echo "Configuration is '$(tridentConfigurationName)'; skipping ACR cleanup."
                  exit 0
                fi

                cd $(TRIDENT_SOURCE_DIR)
                ./bin/storm-trident script acr-delete \
                    --config extensions \
                    --deployment-environment virtualMachine \
                    --acr-name $(ACR_NAME) \
                    --repo-name $(SYSEXT_REPO) \
                    --build-id $(Build.BuildId) \
                    --num-clones 2
