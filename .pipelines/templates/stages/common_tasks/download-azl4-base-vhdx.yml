parameters:
  - name: tridentSourceDirectory
    type: string

steps:
  - bash: |
      set -euxo pipefail

      if ! command -v oras >/dev/null; then
        VERSION="1.2.2"
        ORAS_DIR="$(Agent.TempDirectory)/oras-${VERSION}"
        mkdir -p "$ORAS_DIR"
        curl --fail --location --retry 3 \
          "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz" \
          --output "$ORAS_DIR/oras.tar.gz"
        tar -xzf "$ORAS_DIR/oras.tar.gz" -C "$ORAS_DIR" oras
        export PATH="$ORAS_DIR:$PATH"
      fi

      python3 ./tests/images/testimages.py download-image azl4_qemu_guest
      mkdir -p "$(Build.ArtifactStagingDirectory)/images"
      mv artifacts/azl4_qemu_guest.vhdx "$(Build.ArtifactStagingDirectory)/images/"
    displayName: "Download AZL4 minimal-os VHDX from MCR"
    workingDirectory: ${{ parameters.tridentSourceDirectory }}
