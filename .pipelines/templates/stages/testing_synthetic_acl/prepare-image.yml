parameters:
  - name: variant
    type: string
    values: [standard, mshv]
  - name: micBuildType
    type: string
    default: release
  - name: micVersion
    type: string
    default: '*.*.*'

jobs:
  - job: PrepareSyntheticAcl_${{ parameters.variant }}
    displayName: Build synthetic ACL ${{ parameters.variant }} QCOW2 and COSI
    timeoutInMinutes: 60
    pool:
      type: linux
      name: trident-ubuntu-1es-pool-eastus2
      hostArchitecture: amd64
    variables:
      ob_outputDirectory: $(Pipeline.Workspace)/synthetic-acl-published-${{ parameters.variant }}
      ob_artifactBaseName: synthetic-acl-${{ parameters.variant }}
      ACL_INPUT_DIR: $(Pipeline.Workspace)/synthetic-acl-inputs-${{ parameters.variant }}
      ACL_BUILD_DIR: $(Pipeline.Workspace)/synthetic-acl-build-${{ parameters.variant }}-$(Build.BuildId)-$(System.JobAttempt)
      ${{ if eq(parameters.micBuildType, 'dev') }}:
        ACL_CUSTOMIZER: imagecustomizer:dev
      ${{ else }}:
        ACL_CUSTOMIZER: mcr.microsoft.com/azurelinux/imagecustomizer@sha256:db7bcb75be27cbab4face6dbaedd3b6e6c63c65c369f5763d81499ed843ccd44
    steps:
      - template: ../common_tasks/checkout_trident.yml
      - template: ../common_tasks/avoid-pypi-usage.yml
      - task: DownloadPipelineArtifact@2
        displayName: Download pipeline Trident RPMs
        inputs:
          buildType: current
          artifactName: trident-binaries
          targetPath: $(ACL_INPUT_DIR)/trident
      - task: DownloadPipelineArtifact@2
        displayName: Download test SSH keys
        inputs:
          buildType: current
          artifactName: ssh-keys
          targetPath: $(ACL_INPUT_DIR)/ssh
      - template: ../common_tasks/find-base-image-version.yml
        parameters:
          tridentSourceDirectory: $(TRIDENT_SOURCE_DIR)
      - template: common/base-images-download-template.yaml@platform-pipelines
        parameters:
          buildType: $(BASEIMG_BUILD_TYPE)
          baseImageType: baremetal
          imageVersion: $(BASEIMG_VERSION)
          azureLinuxVersion: '3.0'
      - ${{ if eq(parameters.micBuildType, 'dev') }}:
          - template: common/mic-download-template.yaml@platform-pipelines
            parameters:
              buildType: dev
              arch: amd64
              micVersion: ${{ parameters.micVersion }}
      - task: Bash@3
        displayName: Prepare image-building dependencies and pipeline RPMs
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y binutils libguestfs-tools qemu-utils rpm rpm2cpio cpio
            sudo systemctl start docker
            docker image inspect '$(ACL_CUSTOMIZER)' >/dev/null 2>&1 || docker pull '$(ACL_CUSTOMIZER)'
            mkdir -p '$(ACL_INPUT_DIR)/rpms' '$(ob_outputDirectory)'
            find '$(ACL_INPUT_DIR)/trident' -type f -name '*azl3*.rpm' \
              -exec cp -- '{}' '$(ACL_INPUT_DIR)/rpms/' \;
            chmod 600 '$(ACL_INPUT_DIR)/ssh/id_rsa'
      - ${{ if eq(parameters.variant, 'mshv') }}:
          - checkout: efitreeloader
            fetchDepth: 1
            path: s/efitreeloader
          - task: RustInstaller@1
            displayName: Install EFI loader Rust toolchain
            inputs:
              rustVersion: ms-prod-1.98
              additionalTargets: x86_64-unknown-uefi
              cratesIoFeedOverride: sparse+https://pkgs.dev.azure.com/mariner-org/ECF/_packaging/BMP_PublicPackages/Cargo/index/
              toolchainFeed: https://pkgs.dev.azure.com/mariner-org/ECF/_packaging/Rust.Sdk/nuget/v3/index.json
          - task: Bash@3
            displayName: Prepare pinned EFI loader source and slot-relative profile
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                source='$(Pipeline.Workspace)/s/efitreeloader'
                test "$(git -C "$source" rev-parse HEAD)" = bf02d4e3f4b9a4b61e838fd4d3705a50573d1ce9
                mkdir -p '$(ACL_INPUT_DIR)/loader/.cargo'
                git -C "$source" archive HEAD | tar -xf - -C '$(ACL_INPUT_DIR)/loader'
                cp '$(TRIDENT_SOURCE_DIR)/tests/images/synthetic-acl/load_entries.json' \
                  '$(ACL_INPUT_DIR)/loader/efitreeloader/load_entries.json'
                cp '$(TRIDENT_SOURCE_DIR)/.cargo/config.toml' '$(ACL_INPUT_DIR)/loader/.cargo/config.toml'
                printf '\n[registry]\nglobal-credential-providers = ["cargo:token"]\n' \
                  >> '$(ACL_INPUT_DIR)/loader/.cargo/config.toml'
          - task: CargoAuthenticate@0
            displayName: Authenticate EFI loader dependencies
            inputs:
              configFile: $(ACL_INPUT_DIR)/loader/.cargo/config.toml
          - task: Bash@3
            displayName: Build EFI loader and fetch hash-pinned official MSHV payload
            inputs:
              targetType: inline
              workingDirectory: $(ACL_INPUT_DIR)/loader
              script: |
                set -euo pipefail
                cargo build --locked --target x86_64-unknown-uefi --release
                '$(TRIDENT_SOURCE_DIR)/tests/images/synthetic-acl/fetch-mshv-payload.py' \
                  --output-dir '$(ACL_INPUT_DIR)/mshv-payload'
      - task: Bash@3
        displayName: Build synthetic ACL ${{ parameters.variant }} images
        inputs:
          targetType: inline
          workingDirectory: $(TRIDENT_SOURCE_DIR)
          script: |
            set -euo pipefail
            mapfile -t base_images < <(find '$(Build.ArtifactStagingDirectory)/images' -type f -name '*.vhdx')
            if [[ ${#base_images[@]} -ne 1 ]]; then
              echo 'Expected exactly one plain Azure Linux base image' >&2
              exit 1
            fi
            args=(--variant '${{ parameters.variant }}' --base-image "${base_images[0]}"
              --rpm-dir '$(ACL_INPUT_DIR)/rpms'
              --ssh-public-key '$(ACL_INPUT_DIR)/ssh/id_rsa.pub'
              --ssh-private-key '$(ACL_INPUT_DIR)/ssh/id_rsa'
              --image-customizer '$(ACL_CUSTOMIZER)' --output-dir '$(ACL_BUILD_DIR)')
            if [[ '${{ parameters.variant }}' = mshv ]]; then
              profile=$(sha256sum tests/images/synthetic-acl/load_entries.json | cut -d ' ' -f 1)
              args+=(--efitreeloader '$(ACL_INPUT_DIR)/loader/target/x86_64-unknown-uefi/release/efitreeloader.efi'
                --mshv-payload '$(ACL_INPUT_DIR)/mshv-payload'
                --loader-provenance "bf02d4e3f4b9a4b61e838fd4d3705a50573d1ce9; profile-sha256=$profile")
            fi
            sudo env LIBGUESTFS_BACKEND=direct ./tests/images/prepare-synthetic-acl.py "${args[@]}"
            sudo chown -R "$(id -u):$(id -g)" '$(ACL_BUILD_DIR)'
            for name in base.qcow2 update.cosi metadata.json manifest.json id_rsa; do
              cp -- '$(ACL_BUILD_DIR)'/"$name" '$(ob_outputDirectory)'/
            done
      - template: ../testing_common/fix-output-directory-for-one-branch-step.yml
        parameters:
          outputDir: $(ob_outputDirectory)
          condition: always()
