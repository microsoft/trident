parameters:
  - name: definition
    type: number
    default: 5067 # [GITHUB]-trident-ci
    displayName: Pipeline definition ID

  - name: branch
    type: string
    default: main
    displayName: Branch to download Artifacts from

  - name: tridentPipelineRunId
    type: string
    default: latestFromBranch
    displayName: Pipeline run ID

  - name: runDeploymentVMHost
    type: boolean
    default: true
    displayName: E2E tests Virtual Machines Host

  - name: runDeploymentVMContainer
    type: boolean
    default: false
    displayName: E2E tests Virtual Machines Container

  - name: runDeploymentBMHost
    type: boolean
    default: false
    displayName: E2E tests Bare Metal Host

  - name: runDeploymentBMContainer
    type: boolean
    default: false
    displayName: E2E tests Bare Metal Container

  - name: runFunctionalTests
    type: boolean
    default: false
    displayName: Functional tests

  - name: runServicingTests
    type: boolean
    default: false
    displayName: Servicing VM testing

  - name: runStormE2E
    type: boolean
    default: false
    displayName: Storm E2E tests (VM host and container)

  - name: stormTestRing
    type: string
    default: full-validation
    values:
      - pr-e2e
      - ci
      - pre
      - full-validation
    displayName: Storm E2E test ring (selects which configurations run)

stages:
  # Build the Go tools from the branch under test rather than reusing the ones
  # attached to the run being downloaded from. The shortcut exists to exercise
  # branch code, and the downloaded tools can be arbitrarily old; real CI
  # already builds them this way, so this keeps the two paths on the same
  # mechanism. Runs in parallel with the artifact downloads below.
  #
  # Every stage below consumes the go-tools artifact this publishes, including
  # FunctionalTesting, which already declared a dependency on BuildingTools.
  - ${{ if or(parameters.runDeploymentVMHost, parameters.runDeploymentVMContainer, parameters.runDeploymentBMHost, parameters.runDeploymentBMContainer, parameters.runServicingTests, parameters.runFunctionalTests, parameters.runStormE2E) }}:
      - template: stages/building_tools/building-tools.yml
        parameters:
          architecture: amd64

  # The image downloads are only needed by the stages that consume test images;
  # a functional-only run would otherwise produce a stage with no jobs.
  - ${{ if or(parameters.runDeploymentVMHost, parameters.runDeploymentVMContainer, parameters.runDeploymentBMHost, parameters.runDeploymentBMContainer, parameters.runServicingTests, parameters.runStormE2E) }}:
      - template: stages/download_artifacts/get-artifacts.yml
        parameters:
          definition: ${{ parameters.definition }}
          servicingImages: ${{ parameters.runServicingTests }}
          hostImages: ${{ or(parameters.runDeploymentVMHost, parameters.runDeploymentBMHost, parameters.runStormE2E) }}
          containerImages: ${{ or(parameters.runDeploymentVMContainer, parameters.runDeploymentBMContainer, parameters.runStormE2E) }}
          ${{ if eq(parameters.tridentPipelineRunId, 'latestFromBranch') }}:
            runVersion: latestFromBranch
            branch: ${{ parameters.branch }}
            allowFailedBuilds: false
          ${{ else }}:
            runVersion: specific
            tridentPipelineRunId: ${{ parameters.tridentPipelineRunId }}
            allowFailedBuilds: true

  - ${{ if parameters.runStormE2E }}:
      - template: stages/testing_e2e/storm_e2e.yml
        parameters:
          stageType: ${{ parameters.stormTestRing }}
          # Still a testingRun: the images come from DownloadTestingElements.
          # Only the Go tools moved to being built in-pipeline.
          testingRun: true

  - ${{ if parameters.runFunctionalTests }}:
      - template: stages/testing_functional/functional-testing.yml
        parameters:
          downloadPrebuiltImage: true
          rerunTests: true

  - ${{ if parameters.runDeploymentVMHost }}:
      - template: stages/testing_vm/netlaunch-testing.yml
        parameters:
          buildPurpose: "validation"
          runtimeEnv: "host"
          testingRun: true

  - ${{ if parameters.runDeploymentVMContainer }}:
      - template: stages/testing_vm/netlaunch-testing.yml
        parameters:
          buildPurpose: "validation"
          runtimeEnv: "container"
          testingRun: true

  - ${{ if parameters.runDeploymentBMHost }}:
      - template: stages/testing_baremetal/baremetal-testing.yml
        parameters:
          buildPurpose: "validation"
          runtimeEnv: "host"
          testingRun: true

  - ${{ if parameters.runDeploymentBMContainer }}:
      - template: stages/testing_baremetal/baremetal-testing.yml
        parameters:
          buildPurpose: "validation"
          runtimeEnv: "container"
          testingRun: true
          ${{ if parameters.runDeploymentBMHost }}:
            extraDependsOn: "BaremetalDeploymentTesting_host"

  - ${{ if parameters.runServicingTests }}:
      - template: stages/testing_servicing/vm-testing.yml
        parameters:
          testingRun: true
          verboseLogging: true
          includeQemu: true
          includeAzure: false # To test in Azure please use trident-pr-e2e-azure pipeline
