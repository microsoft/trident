parameters:
  - name: ACL_CUSTOMIZER_PIN
    type: string
    # From microsoft/azure-linux-image-tools branch user/frhuelsz/acl-baremetal.
    default: a7526eb98a57b41b5d4a0789fcf72622e6a8729a
  - name: aclAgentTestParallelJobs
    displayName: Number of parallel ACL-agent test jobs
    type: number
    default: 1

trigger: none

resources:
  repositories:
    - repository: aclImageTools
      type: github
      name: microsoft/azure-linux-image-tools
      endpoint: microsoft
      ref: ${{ parameters.ACL_CUSTOMIZER_PIN }}

    - repository: platform-tests
      type: git
      name: platform-tests

    - repository: platform-pipelines
      type: git
      name: platform-pipelines
      ref: refs/heads/main

    - repository: platform-telemetry
      name: platform-telemetry
      type: git
      ref: refs/heads/main

variables:
  - name: ACL_CUSTOMIZER_PIN
    value: ${{ parameters.ACL_CUSTOMIZER_PIN }}
  # For pipelines that do not produce any production artifacts, disable CodeQL analysis
  - name: Codeql.Enabled
    value: false

extends:
  template: templates/MockOB.yml
  parameters:
    stages:
      - template: templates/pipeline-selector.yml
        parameters:
          targetStage: pr-e2e
          blockPublishing: true
          includeAclTests: true
          aclAgentTestParallelJobs: ${{ parameters.aclAgentTestParallelJobs }}
