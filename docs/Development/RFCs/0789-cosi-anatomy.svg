<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" role="img" aria-labelledby="cosi-map-title cosi-map-desc" width="1000" height="830">
  <title id="cosi-map-title">Example COSI archive with sysext and confext images</title>
  <desc id="cosi-map-desc">An example tar archive starts with cosi-marker and metadata.json, then a primary GPT image and seven example disk-region images. Two compressed extension images follow. Metadata describes their paths, sizes, compressed SHA-384 hashes, and extension IDs. The ESP and extension images contain their own filesystems; extension images are not disk partitions or files inside the OS partition images.</desc>
  <style>
.canvas {fill:#f3f5f8}
.box {fill:#fff; stroke:#c7d1dd; stroke-width:1.5}
.highlight {fill:#eaf1fc; stroke:#2357a2}
.payload {fill:#e7f5eb; stroke:#17633e; stroke-width:1.5}
text {fill:#182432; font:15px system-ui,sans-serif}
.sub {fill:#526173; font-size:13px}
.label {fill:#2357a2; font-size:12px; font-weight:700}
.heading {font-weight:700}
.mono {font:12px ui-monospace,monospace}
.wire {fill:none; stroke:#526173; stroke-width:1.7}
.arrow {fill:#526173}
@media (prefers-color-scheme: dark) {
 .canvas {fill:#111820}
 .box {fill:#19232f; stroke:#43566c}
 .highlight {fill:#22344c; stroke:#96bfff}
 .payload {fill:#173b2a; stroke:#9be1b4}
 text {fill:#e4ecf4}
 .sub {fill:#a9b9ca}
 .label {fill:#96bfff}
 .wire {stroke:#a9b9ca}
 .arrow {fill:#a9b9ca}
}
  </style>
  <rect class="canvas" width="100%" height="100%" />
  <defs>
    <marker id="cosi-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path class="arrow" d="M0 0 L8 4 L0 8 Z" />
    </marker>
  </defs>
  <rect class="box" x="12" y="12" width="350" height="762" rx="9" />
  <text class="heading" x="28" y="41">example.cosi</text>
  <text class="sub" x="28" y="65">12 tar members, shown in archive order</text>
  <rect class="box" x="28" y="83" width="318" height="31" rx="4" />
  <text class="mono" x="42" y="104">1  cosi-marker</text>
  <rect class="box highlight" x="28" y="124" width="318" height="53" rx="4" />
  <text class="heading" x="42" y="147">2  metadata.json</text>
  <text class="sub" x="42" y="168">COSI 1.3: disk layout and extension references</text>
  <rect class="box" x="28" y="188" width="318" height="39" rx="4" />
  <text class="mono" x="42" y="212">3  images/primary-gpt.raw.zst</text>
  <rect class="box" x="28" y="241" width="318" height="253" rx="4" />
  <text class="label" x="42" y="262">images/  (example disk-region members)</text>
  <text class="mono" x="42" y="289">part-1.raw.zst   ESP (boot files)</text>
  <text class="mono" x="42" y="317">part-2.raw.zst   /usr filesystem</text>
  <text class="mono" x="42" y="345">part-3.raw.zst   /usr verity hashes</text>
  <text class="mono" x="42" y="373">part-4.raw.zst   second /usr region</text>
  <text class="mono" x="42" y="401">part-5.raw.zst   second hash region</text>
  <text class="mono" x="42" y="429">part-6.raw.zst   OEM</text>
  <text class="mono" x="42" y="457">part-7.raw.zst   root filesystem</text>
  <text class="sub" x="42" y="482">Numbers refer to the example source disk.</text>
  <rect class="payload" x="28" y="511" width="318" height="231" rx="4" />
  <text class="label" x="42" y="535">images/extensions/  (extension members)</text>
  <rect class="box" x="40" y="550" width="294" height="74" rx="4" />
  <text class="mono" x="52" y="575">gpu-driver.raw.zst</text>
  <text class="sub" x="52" y="600">Compressed sysext DDI</text>
  <rect class="box" x="40" y="637" width="294" height="74" rx="4" />
  <text class="mono" x="52" y="662">fleet-config.raw.zst</text>
  <text class="sub" x="52" y="687">Compressed confext DDI</text>
  <text class="sub" x="28" y="761">Schematic; sizes are not to scale.</text>
  <rect class="box highlight" x="436" y="12" width="550" height="187" rx="7" />
  <text class="heading" x="452" y="38">Metadata is the map</text>
  <text class="mono" x="452" y="64">disk.gptRegions[] → GPT + partition members</text>
  <text class="mono" x="452" y="89">images[] → filesystem and verity roles</text>
  <text class="mono" x="452" y="114">extensions.sysexts[] / confexts[] → DDIs</text>
  <text class="sub" x="452" y="141">Extension entry: id, image, optional destination path</text>
  <text class="sub" x="452" y="163">ImageFile: tar path, compressedSize, uncompressedSize</text>
  <text class="sub" x="452" y="186">ImageFile.sha384: hash of compressed member</text>
  <path class="wire" d="M346 151 H397 V96 H429" marker-end="url(#cosi-arrow)" />
  <rect class="box" x="436" y="207" width="550" height="165" rx="7" />
  <text class="heading" x="452" y="234">Open part-1.raw.zst: Zstd → FAT ESP image</text>
  <text class="mono" x="452" y="261">/EFI/Linux/example.efi</text>
  <text class="sub" x="452" y="286">Example UKI containing the kernel and initrd.</text>
  <text class="mono" x="452" y="312">/EFI/Linux/example.addon.efi</text>
  <text class="sub" x="452" y="344">Boot files inside a partition image, not loose tar entries.</text>
  <path class="wire" d="M346 288 H429" marker-end="url(#cosi-arrow)" />
  <rect class="box highlight" x="436" y="409" width="550" height="150" rx="7" />
  <text class="heading" x="452" y="436">Open gpu-driver.raw.zst: Zstd → sysext DDI</text>
  <text class="mono" x="452" y="464">/usr/lib/extension-release.d/extension-release.gpu-driver</text>
  <text class="sub" x="452" y="489">ID=_any  ·  SYSEXT_ID=gpu-driver</text>
  <text class="mono" x="452" y="517">/usr/bin/gpu-tool</text>
  <text class="sub" x="452" y="542">These paths are inside the DDI's filesystem.</text>
  <path class="wire" d="M334 587 H391 V485 H429" marker-end="url(#cosi-arrow)" />
  <rect class="box highlight" x="436" y="594" width="550" height="164" rx="7" />
  <text class="heading" x="452" y="621">Open fleet-config.raw.zst: Zstd → confext DDI</text>
  <text class="mono" x="452" y="649">/etc/extension-release.d/extension-release.fleet-config</text>
  <text class="sub" x="452" y="674">ID=_any  ·  CONFEXT_ID=fleet-config</text>
  <text class="mono" x="452" y="702">/etc/fleet/config.toml</text>
  <text class="sub" x="452" y="729">These paths are inside the DDI's filesystem.</text>
  <path class="wire" d="M334 675 H429" marker-end="url(#cosi-arrow)" />
  <text class="sub" x="20" y="799">This disk layout is an example, not a requirement for COSI files.</text>
  <text class="sub" x="20" y="821">Extension images are extra tar members, not new disk partitions.</text>
</svg>
