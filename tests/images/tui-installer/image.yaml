name: tui-installer

outputs:
  - format: iso

base:
  azureLinux:
    version: "3.0"
    variant: minimal-os

rpmSources:
  - rpms

extraDependencies:
  - cosi
  - rpms

config:
  previewFeatures:
    - input-image-oci
  os:
    hostname: trident-installer
    bootloader:
      resetType: hard-reset
    selinux:
      mode: disabled
    kernelCommandLine:
      extraCommandLine:
        - console=tty0
        - console=ttyS0,115200n8
        - quiet
        - loglevel=0
        - systemd.show_status=false
    packages:
      install:
        - trident-installer
  storage:
    bootType: efi
    disks:
      - partitionTableType: gpt
        maxSize: 4G
        partitions:
          - id: esp
            type: esp
            size: 8M
          - id: rootfs
            size: grow
    filesystems:
      - deviceId: esp
        type: fat32
        mountPoint:
          path: /boot/efi
          options: umask=0077
      - deviceId: rootfs
        type: ext4
        mountPoint:
          path: /
  iso:
    initramfsType: full-os
    additionalFiles:
      - source: cosi/payload.cosi
        destination: /cosi/payload.cosi
    kernelCommandLine:
      extraCommandLine:
        - console=tty0
        - console=ttyS0,115200n8
        - quiet
        - loglevel=0
        - systemd.show_status=false
        - trident.installer=1
