storage:
  bootType: efi

  disks:
    - partitionTableType: gpt
      maxSize: 4G
      partitions:
        - id: esp
          type: esp
          size: 8M

        - id: rootfs
          size: grow

  filesystems:
    - deviceId: esp
      type: fat32
      mountPoint:
        path: /boot/efi
        options: umask=0077

    - deviceId: rootfs
      type: ext4
      mountPoint:
        path: /

os:
  bootloader:
    resetType: hard-reset
  hostname: trident-container-mos-testimg

  packages:
    install:
      - curl
      - device-mapper
      - dnf
      - docker-cli
      - iproute
      - iptables
      - linux-firmware-intel
      - mdadm
      - moby-engine
      - openssh-server
      - selinux-policy
      - squashfs-tools
      - tar
      - vim

  additionalFiles:
    - source: ../../shared/05-installer-dhcp.network
      destination: /etc/systemd/network/05-installer-dhcp.network
    - source: ../../shared/99-installer-networking.cfg
      destination: /etc/cloud/cloud.cfg.d/99-installer-networking.cfg
    - source: ../../shared/10-installer-wait-online.conf
      destination: /etc/systemd/system/systemd-networkd-wait-online.service.d/10-installer-wait-online.conf
    - source: ../../shared/10-installer-network-online.conf
      destination: /etc/systemd/system/trident-container.service.d/10-installer-network-online.conf
    - source: files/getty@.service
      destination: /usr/lib/systemd/system/getty@.service
    - source: files/serial-getty@.service
      destination: /usr/lib/systemd/system/serial-getty@.service
    - source: files/root.profile
      destination: /root/.profile
    - source: files/trident-container.service
      destination: /usr/lib/systemd/system/trident-container.service
    - source: files/containerd-mmap-fix.cil
      destination: /usr/share/selinux/packages/containerd-mmap-fix.cil

  services:
    enable:
      - systemd-networkd
      - systemd-networkd-wait-online
      - trident-container
      - sshd

scripts:
  postCustomization:
    - content: |
        set -eu
        cd /lib/firmware/intel/ice/ddp
        test -f ice-1.3.30.0.pkg
        ln -sfn ice-1.3.30.0.pkg ice.pkg
        test -r ice.pkg
    - path: scripts/post-install.sh
    - path: scripts/load-containerd-selinux-fix.sh

iso:
  additionalFiles:
    - source: files/config-placeholder.yaml
      destination: /trident-config.yaml
    - source: files/override-placeholder.conf
      destination: /trident-override.conf
  kernelCommandLine:
    extraCommandLine:
      - enforcing=0
      - console=tty0
      - console=ttyS0
      - rd.luks=0
