[Unit]
Wants=trident-acl-agent-cert-install.service
After=trident-acl-agent-cert-install.service

[Service]
Environment=TRIDENT_ACL_AGENT_KUBERNETES_ANNOTATION_PREFIX=acl.azure.com
Environment=TRIDENT_ACL_AGENT_CURRENT_VERSION_KEY=IMAGE_VERSION
Environment=TRIDENT_ACL_AGENT_ORCHESTRATION_MODE=annotations
Environment=TRIDENT_ACL_AGENT_CURRENT_VERSION_PATH=/etc/os-release
Environment=TRIDENT_ACL_AGENT_CURRENT_VERSION_FALLBACK=always
