storage:
  bootType: efi
  disks:
  - maxSize: 5G
    partitionTableType: gpt
    partitions:
    - id: esp
      size: 8M
      type: esp
    - id: root
      size: 4G
  filesystems:
  - deviceId: esp
    mountPoint:
      options: umask=0077
      path: /boot/efi
    type: fat32
  - deviceId: root
    mountPoint: /
    type: ext4
os:
  hostname: trident-vm-testimg
  packages:
    install:
    - curl
    - dnf
    - efibootmgr
    - grub2-efi-binary-noprefix
    - iproute
    - iptables
    - jq
    - lsof
    - netplan
    - openssh-server
    - trident-service
    - vim
    - netplan
    remove:
    - grub2-efi-binary
  bootloader:
    resetType: hard-reset
  selinux:
    mode: disabled
  kernelCommandLine:
    extraCommandLine:
    - console=tty0
    - console=tty1
    - console=ttyS0
    - rd.debug
    - loglevel=6
    - log_buf_len=1M
    - systemd.journald.forward_to_console=1
  services:
    enable:
    - trident
    - tridentd.socket
  users:
  - name: testuser
    sshPublicKeyPaths:
    - base/files/id_rsa.pub
    secondaryGroups:
    - wheel
  additionalFiles:
  - source: base/files/sudoers-wheel
    destination: /etc/sudoers.d/wheel
  - source: base/files/99-dhcp-eth0.network
    destination: /etc/systemd/network/99-dhcp-eth0.network
  - source: base/files/use-grpc-client-commit.conf
    destination: /etc/systemd/system/trident.service.d/override.conf
scripts:
  postCustomization:
  - path: base/scripts/post-install.sh
  - path: base/scripts/ssh-move-host-keys.sh
  - path: base/scripts/duid-type-to-link-layer.sh
  - path: base/scripts/update-os-release.sh
