bootloader:
  resetType: hard-reset
selinux:
  mode: disabled
kernelCommandLine:
  extraCommandLine:
    - console=tty0
    - console=tty1
    - console=ttyS0
    - rd.debug
    - loglevel=6
    - log_buf_len=1M
    - systemd.journald.forward_to_console=1
packages:
  remove:
    - grub2-efi-binary
users:
  - name: testuser
    sshPublicKeyPaths:
      - base/files/id_rsa.pub
    secondaryGroups:
      - wheel
