name: trident-installer

matrix:
  arch: [amd64, arm64]
  variant: [default, split, direct-streaming]

selectors:
  exclude:
    - { arch: arm64, variant: split }

base:
  ref: baremetal

outputs:
  - format: iso

rpmSources:
  - ../../../bin/RPMS

extraDependencies:
  - ./base

config:
  storage:
    $include: ./include/storage.yaml
  os:
    bootloader:
      resetType: hard-reset
    hostname: trident-mos-testimage
    packages:
      install:
        - $include: ./include/common-packages.yaml
        - binutils
        - trident-static-pcrlock-files
        - selinux-policy
        - selinux-policy-devel
        - audit
    services:
      enable:
        - sshd
        - trident-install
        - tridentd.socket
    additionalFiles:
      - $include: ./include/common-files.yaml
      - source: base/files/trident-install.service
        destination: /usr/lib/systemd/system/trident-install.service
    selinux:
      mode: enforcing
  scripts:
    postCustomization:
      - path: base/post-install.sh
  iso:
    additionalFiles:
      - source: ../common/files/config-placeholder.yaml
        destination: /trident-config.yaml
      - source: ../common/files/override-placeholder.conf
        destination: /trident-override.conf
    kernelCommandLine:
      extraCommandLine:
        - $include: ./include/kernel-args.yaml
