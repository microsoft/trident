storage:
  bootType: efi
  disks:
  - partitionTableType: gpt
    maxSize: 4G
    partitions:
    - id: esp
      type: esp
      size: 8M
    - id: rootfs
      size: grow
  filesystems:
  - deviceId: esp
    type: fat32
    mountPoint:
      path: /boot/efi
      options: umask=0077
  - deviceId: rootfs
    type: ext4
    mountPoint:
      path: /
os:
  bootloader:
    resetType: hard-reset
  hostname: trident-mos-testimage
  packages:
    install:
    - binutils
    - curl
    - device-mapper
    - dnf
    - dosfstools
    - efibootmgr
    - iproute
    - iptables
    - lsof
    - mdadm
    - netplan
    - ntfs-3g
    - ntfsprogs
    - openssh-server
    - trident-static-pcrlock-files
    - squashfs-tools
    - tar
    - tpm2-tools
    - trident
    - vim
    - veritysetup
    - selinux-policy
    - selinux-policy-devel
    - audit
  services:
    enable:
    - sshd
    - trident-install
    - tridentd.socket
  additionalFiles:
  - source: base/files/getty@.service
    destination: /usr/lib/systemd/system/getty@.service
  - source: base/files/serial-getty@.service
    destination: /usr/lib/systemd/system/serial-getty@.service
  - source: base/files/root.profile
    destination: /root/.profile
  - source: base/files/trident-install.service
    destination: /usr/lib/systemd/system/trident-install.service
  selinux:
    mode: enforcing
scripts:
  postCustomization:
  - path: base/post-install.sh
iso:
  additionalFiles:
  - source: base/files/config-placeholder.yaml
    destination: /trident-config.yaml
  - source: base/files/override-placeholder.conf
    destination: /trident-override.conf
  kernelCommandLine:
    extraCommandLine:
    - console=tty0
    - console=ttyS0
    - rd.luks=0
