storage:
  bootType: efi

  disks:
    - partitionTableType: gpt
      maxSize: 4G
      partitions:
        - id: esp
          type: esp
          size: 8M

        - id: rootfs
          size: grow

  filesystems:
    - deviceId: esp
      type: fat32
      mountPoint:
        path: /boot/efi
        options: umask=0077

    - deviceId: rootfs
      type: ext4
      mountPoint:
        path: /

os:
  bootloader:
    resetType: hard-reset
  hostname: trident-direct-streaming-mos-testimage

  packages:
    update:
      - systemd

    install:
      - binutils
      - curl
      - device-mapper
      - dnf
      - dosfstools
      - efibootmgr
      - iproute
      - iptables
      - linux-firmware-intel
      - lsof
      - mdadm
      - netplan
      # Support for mounting NTFS filesystems
      - ntfs-3g
      # Support for creating NTFS filesystems
      - ntfsprogs
      - openssh-server
      - squashfs-tools
      - tar
      - tpm2-tools
      - veritysetup
      - vim
      # Support for building SELinux module and debugging
      - selinux-policy-devel
      - setools-console
      # Add trident and tridentd
      - trident
      # Add trident selinux policy files
      - trident-selinux
      # Add trident-install.service
      - trident-install-service

  services:
    enable:
      - systemd-networkd
      - systemd-networkd-wait-online
      - sshd
      - rcp-agent
      - tridentd.socket
    disable:
      - trident-install

  additionalFiles:
    - source: ../../shared/05-installer-dhcp.network
      destination: /etc/systemd/network/05-installer-dhcp.network
    - source: ../../shared/99-installer-networking.cfg
      destination: /etc/cloud/cloud.cfg.d/99-installer-networking.cfg
    - source: ../../shared/10-installer-wait-online.conf
      destination: /etc/systemd/system/systemd-networkd-wait-online.service.d/10-installer-wait-online.conf
    - source: ../../shared/10-installer-network-online.conf
      destination: /etc/systemd/system/rcp-agent.service.d/10-installer-network-online.conf
    - source: files/getty@.service
      destination: /usr/lib/systemd/system/getty@.service
    - source: files/serial-getty@.service
      destination: /usr/lib/systemd/system/serial-getty@.service
    - source: files/root.profile
      destination: /root/.profile

    # Netlaunch RCP files
    - source: ../../../../bin/rcp-agent
      destination: /usr/bin/rcp-agent
    - source: ../../../../tools/cmd/rcp-agent/rcp-agent.service
      destination: /usr/lib/systemd/system/rcp-agent.service

  selinux:
    mode: enforcing

scripts:
  postCustomization:
    - content: |
        set -eu
        cd /lib/firmware/intel/ice/ddp
        test -f ice-1.3.30.0.pkg
        ln -sfn ice-1.3.30.0.pkg ice.pkg
        test -r ice.pkg
    - path: post-install.sh
      arguments:
        - "stream-image-test"

iso:
  additionalFiles:
    # Add pre-trident script to be run early by rcp-agent
    - source: files/pre-trident-script.sh
      destination: /pre-trident-script.sh
    # Add overridable default config for rcp-agent
    - source: files/rcp-agent.yaml
      destination: /rcp-agent.yaml

  kernelCommandLine:
    extraCommandLine:
      - console=tty0
      - console=ttyS0
      - rd.luks=0
      - selinux=1
