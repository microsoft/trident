storage:
  bootType: efi

  disks:
    - partitionTableType: gpt
      maxSize: 4G
      partitions:
        - id: esp
          type: esp
          size: 8M

        - id: rootfs
          size: grow

  filesystems:
    - deviceId: esp
      type: fat32
      mountPoint:
        path: /boot/efi
        options: umask=0077

    - deviceId: rootfs
      type: ext4
      mountPoint:
        path: /

os:
  bootloader:
    resetType: hard-reset
  hostname: trident-mos-testimage

  packages:
    install:
      - binutils
      - curl
      - device-mapper
      - dnf
      - dosfstools
      - efibootmgr
      - iproute
      - iptables
      - lsof
      - mdadm
      - netplan
      # Optional dependencies for NTFS
      - ntfs-3g
      - ntfsprogs
      - openssh-server
      # Package required for systemd-pcrlock & PCR-based encryption; can be removed once AZL 4.0
      # merges a fix to provide statically defined files inside the same package as the
      # systemd-pcrlock binary, i.e. systemd-udev.
      - trident-static-pcrlock-files
      - squashfs-tools
      - tar
      - tpm2-tools
      - trident
      - vim
      - veritysetup
      - selinux-policy
      - selinux-policy-devel
      - audit

  services:
    enable:
      - systemd-networkd
      - systemd-networkd-wait-online
      - sshd
      - trident-install
      - tridentd.socket

  additionalFiles:
    - source: ../../shared/05-installer-dhcp.network
      destination: /etc/systemd/network/05-installer-dhcp.network
    - source: ../../shared/99-installer-networking.cfg
      destination: /etc/cloud/cloud.cfg.d/99-installer-networking.cfg
    - source: ../../shared/10-installer-wait-online.conf
      destination: /etc/systemd/system/systemd-networkd-wait-online.service.d/10-installer-wait-online.conf
    - source: ../../shared/10-installer-network-online.conf
      destination: /etc/systemd/system/trident-install.service.d/10-installer-network-online.conf
    - source: files/getty@.service
      destination: /usr/lib/systemd/system/getty@.service
    - source: files/serial-getty@.service
      destination: /usr/lib/systemd/system/serial-getty@.service
    - source: files/root.profile
      destination: /root/.profile
    - source: files/trident-install.service
      destination: /usr/lib/systemd/system/trident-install.service

  selinux:
    mode: enforcing

scripts:
  postCustomization:
    - path: post-install.sh

iso:
  additionalFiles:
    - source: files/config-placeholder.yaml
      destination: /trident-config.yaml
    - source: files/override-placeholder.conf
      destination: /trident-override.conf
  kernelCommandLine:
    extraCommandLine:
      - console=tty0
      - console=ttyS0
      - rd.luks=0
