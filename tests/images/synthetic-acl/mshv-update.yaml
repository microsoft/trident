storage:
  bootType: efi
  disks:
    - partitionTableType: gpt
      partitions:
        - id: esp
          label: EFI-SYSTEM
          type: esp
          size: 512M
        - id: usr-a
          label: USR-A
          type: usr
          size: 3G
        - id: hash-a
          label: HASH-A
          type: usr-verity
          size: 128M
        - id: usr-b
          label: USR-B
          type: usr
          size: 3G
        - id: hash-b
          label: HASH-B
          type: usr-verity
          size: 128M
        - id: oem
          label: OEM
          type: linux-generic
          size: 128M
        - id: root
          label: ROOT
          type: root
          size: 4G
  verity:
    - id: usrverity
      name: usr
      dataDeviceId: usr-a
      hashDeviceId: hash-a
      dataDeviceMountIdType: part-label
      hashDeviceMountIdType: part-label
      corruptionOption: panic
  filesystems:
    - deviceId: esp
      type: fat32
      mountPoint:
        idType: uuid
        # The finalizer moves this mount to /boot after IC creates the UKI.
        path: /boot/efi
        options: umask=0077
    - deviceId: usrverity
      type: ext4
      mountPoint:
        path: /usr
        options: defaults,ro
    - deviceId: oem
      type: ext4
      mountPoint:
        idType: uuid
        path: /oem
    - deviceId: root
      type: ext4
      mountPoint:
        idType: uuid
        path: /

os:
  bootloader:
    resetType: hard-reset
  hostname: synthetic-acl-mshv
  selinux:
    mode: disabled
  uki:
    mode: create
  kernelCommandLine:
    extraCommandLine:
      - console=ttyS0,115200
      - console=tty0
      - rd.hostonly=0
      - mount.usr=/dev/mapper/usr
      - mount.usrflags=ro
  packages:
    installLists:
      - trident-packages.json
    removeLists:
      - remove-packages.json
    install:
      - device-mapper
      - dracut
      - efibootmgr
      - iproute
      - jq
      - openssh-server
      - systemd-boot
      - systemd-networkd
      - systemd-udev
      - tar
      - veritysetup
      - kernel-mshv
      # shim 16.1 is incompatible with mshv-bootloader-lx (AZL 63139272).
      - shim-15.8-6.azl3.x86_64
  users:
    - name: root
      sshPublicKeyPaths:
        - id_rsa.pub
  services:
    enable:
      - sshd
      - systemd-networkd
      - tridentd.socket
  additionalFiles:
    - source: 99-synthetic-acl.conf
      destination: /etc/dracut.conf.d/99-synthetic-acl.conf
  additionalDirs:
    - source: mshv-licenses
      destination: /usr/share/licenses

scripts:
  postCustomization:
    - path: configure.sh
      arguments:
        - mshv
        - update

previewFeatures:
  - uki
