os:
  selinux:
    mode: disabled
  uki:
    mode: create
  kernelCommandLine:
    extraCommandLine:
      - console=ttyS0,115200
      - console=tty0
      - rd.hostonly=0
      - mount.usr=/dev/mapper/usr
      - mount.usrflags=ro
  users:
    - name: root
      sshPublicKeyPaths:
        - id_rsa.pub
  services:
    enable:
      - sshd
      - systemd-networkd
      - tridentd.socket
  additionalFiles:
    - source: 99-synthetic-acl.conf
      destination: /etc/dracut.conf.d/99-synthetic-acl.conf
    - source: generation
      destination: /usr/lib/synthetic-acl-generation

previewFeatures:
  - uki
