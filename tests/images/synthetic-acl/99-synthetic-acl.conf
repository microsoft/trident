# ACL's RPM initramfs opens /usr through systemd-veritysetup, not the legacy
# verity.usrhash bootengine path. Include Hyper-V storage/network for Gen2.
hostonly="no"
add_dracutmodules+=" systemd systemd-initrd systemd-udevd dm systemd-veritysetup usrmount "
add_drivers+=" hv_vmbus hv_storvsc hv_netvsc virtio_pci virtio_blk virtio_scsi dm_verity ext4 vfat "
install_items+=" /usr/lib/systemd/systemd-veritysetup /usr/lib/systemd/system-generators/systemd-veritysetup-generator "
