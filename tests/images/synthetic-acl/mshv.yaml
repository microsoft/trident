baseConfigs:
  - path: common.yaml

# IC only supports storage in the top-level config, not an inherited config.
storage:
  bootType: efi
  disks:
    - partitionTableType: gpt
      partitions:
        - id: esp
          label: EFI-SYSTEM
          type: esp
          size: 512M
        - id: usr-a
          label: USR-A
          type: usr
          size: 3G
        - id: hash-a
          label: HASH-A
          type: usr-verity
          size: 128M
        - id: usr-b
          label: USR-B
          type: usr
          size: 3G
        - id: hash-b
          label: HASH-B
          type: usr-verity
          size: 128M
        - id: oem
          label: OEM
          type: linux-generic
          size: 128M
        - id: root
          label: ROOT
          type: root
          size: 4G
  verity:
    - id: usrverity
      name: usr
      dataDeviceId: usr-a
      hashDeviceId: hash-a
      dataDeviceMountIdType: part-label
      hashDeviceMountIdType: part-label
      corruptionOption: panic
  filesystems:
    - deviceId: esp
      type: fat32
      mountPoint:
        idType: uuid
        # normalize_disk moves this mount to /boot after IC creates the UKI.
        path: /boot/efi
        options: umask=0077
    - deviceId: usrverity
      type: ext4
      mountPoint:
        path: /usr
        options: defaults,ro
    - deviceId: oem
      type: ext4
      mountPoint:
        idType: uuid
        path: /oem
    - deviceId: root
      type: ext4
      mountPoint:
        idType: uuid
        path: /

os:
  bootloader:
    resetType: hard-reset
  hostname: synthetic-acl-mshv
  packages:
    installLists:
      - trident-packages.json
    removeLists:
      - remove-packages.json
    install:
      - device-mapper
      - dracut
      - efibootmgr
      - iproute
      - jq
      - openssh-server
      - systemd-boot
      - systemd-networkd
      - systemd-udev
      - tar
      - veritysetup
      - kernel-mshv
      # shim 16.1 is incompatible with mshv-bootloader-lx (AZL 63139272).
      - shim-15.8-6.azl3.x86_64
  additionalDirs:
    - source: mshv-licenses
      destination: /usr/share/licenses

scripts:
  postCustomization:
    - path: configure.sh
      arguments:
        - mshv

previewFeatures:
  - base-configs
  - uki
