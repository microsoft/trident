name: trident-testimage
matrix:
  arch:
  - amd64
  scenario:
  - base
  distro:
  - azl4
base:
  path: ../../../../artifacts/azl4_minimal_os.vhdx
rpmSources:
- ../../../../bin/RPMS
params:
  shellDollar: $
outputs:
- format: cosi
config:
  previewFeatures:
  - preview-distro-version
  storage:
    bootType: efi
    disks:
    - partitionTableType: gpt
      maxSize: 5G
      partitions:
      - id: esp
        type: esp
        size: 16M
      - id: rootfs
        size: grow
    filesystems:
    - deviceId: esp
      type: fat32
      mountPoint:
        path: /boot/efi
        options: umask=0077
    - deviceId: rootfs
      type: ext4
      mountPoint:
        path: /
  os:
    bootloader:
      resetType: hard-reset
    hostname: trident-azl4-testimg
    selinux:
      mode: disabled
    kernelCommandLine:
      extraCommandLine:
      - console=tty0
      - console=ttyS0
      - rd.info
      - log_buf_len=1M
      - net.ifnames=0
      - loglevel=6
      - systemd.journald.forward_to_console=1
    packages:
      install:
      - attr
      - cryptsetup
      - curl
      - dnf5
      - efibootmgr
      - grub2-efi-x64
      - grub2-efi-x64-modules
      - grub2-tools
      - grub2-tools-efi
      - iproute
      - iptables-nft
      - lsof
      - mdadm
      - netplan
      - netplan-default-backend-networkd
      - openssh-clients
      - openssh-server
      - policycoreutils
      - selinux-policy
      - tpm2-tools
      - shim
      - sudo
      - systemd-networkd
      - systemd-resolved
      - systemd-sysext
      - systemd-confext
      - systemd-dissect
      - trident-service
      - vim
      - audit
      - device-mapper
      - dosfstools
      - lvm2
      - veritysetup
      - ntfs-3g
      - ntfsprogs
    services:
      enable:
      - sshd
      - systemd-networkd
      - systemd-resolved
      - trident
      - tridentd.socket
      - netplan-configure.service
    additionalFiles:
    - source: ../common/files/hostname-shim.sh
      destination: /usr/local/bin/hostname
      permissions: '755'
    - source: ../common/files/use-grpc-client-commit.conf
      destination: /etc/systemd/system/trident.service.d/override.conf
    - source: ../common/files/regen-sshd-keys.service
      destination: /etc/systemd/system/regen-sshd-keys.service
  scripts:
    postCustomization:
    - content:
        $include: ../common/scripts.yaml#/audit-directory
      interpreter: /bin/bash
    - interpreter: /bin/bash
      content:
        $include: ../common/scripts.yaml#/azl4-move-host-keys
    - interpreter: /bin/bash
      content:
        $include: ../common/scripts.yaml#/azl4-enable-regen-sshd-keys
    - interpreter: /bin/bash
      content:
        $include: ../common/scripts.yaml#/azl4-rebuild-initrd
    - interpreter: /bin/bash
      content:
        $include: ../common/scripts.yaml#/azl4-strip-selinux-xattrs
extraDependencies:
- image.yaml
- ../common/scripts.yaml
- ../common/files
