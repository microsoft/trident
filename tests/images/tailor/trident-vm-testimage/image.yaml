name: vm

matrix:
  arch: [amd64]
  # Apply the scenario layout before distro substitutions.
  scenario: [base, update]
  distro: [azl3, azl4]

base:
  path: ../../../../artifacts/qemu_guest.vhdx

rpmSources:
  - ../../../../bin/RPMS

params:
  # Preserve shell ${...} expressions through Tailor interpolation.
  shellDollar: "$"

outputs:
  - format: cosi
