name: trident-verity-testimage
matrix:
  arch:
  - amd64
  scenario:
  - base
  runtime:
  - host
  - container
  verity:
  - root
  distro:
  - azl3
  - azl4
base:
  path: ../../../../artifacts/baremetal.vhdx
outputs:
- format: cosi
params:
  shellDollar: $
extraDependencies:
- image.yaml
- ../common/scripts.yaml
- ../common/files
config:
  storage:
    disks:
    - partitionTableType: gpt
      maxSize: 5G
      partitions:
      - id: esp
        type: esp
        size: 8M
      - id: boot
        size: 1G
      - label: root
        id: root
        size: 2G
      - label: root-hash
        id: verityhash
        size: 128M
      - id: sysexts
        size: 1G
      - id: confexts
        size: 200M
      - id: var
        size: grow
    bootType: efi
    verity:
    - id: rootverity
      name: root
      dataDeviceId: root
      hashDeviceId: verityhash
      dataDeviceMountIdType: part-label
      hashDeviceMountIdType: part-label
    filesystems:
    - deviceId: esp
      type: fat32
      mountPoint:
        path: /boot/efi
        options: umask=0077
    - deviceId: boot
      type: ext4
      mountPoint:
        path: /boot
    - deviceId: rootverity
      type: ext4
      mountPoint:
        path: /
        options: defaults,ro
    - deviceId: sysexts
      type: ext4
      mountPoint:
        path: /var/lib/extensions
    - deviceId: confexts
      type: ext4
      mountPoint:
        path: /var/lib/confexts
    - deviceId: var
      type: ext4
      mountPoint:
        path: /var
  os:
    bootloader:
      resetType: hard-reset
    hostname: trident-container-verity-testimg
    selinux:
      mode: disabled
    kernelCommandLine:
      extraCommandLine:
      - console=tty0
      - console=ttyS0
      - rd.info
      - log_buf_len=1M
    packages:
      remove:
      - grub2-efi-binary
      install:
      - grub2-efi-binary-noprefix
      - curl
      - device-mapper
      - dnf
      - docker-cli
      - dosfstools
      - dracut-overlayfs
      - efibootmgr
      - iproute
      - iptables
      - lsof
      - lvm2
      - mdadm
      - moby-engine
      - netplan
      - openssh-server
      - systemd-udev
      - tpm2-tools
      - veritysetup
      - squashfs-tools
      - tar
      - vim
    additionalFiles:
    - source: ../common/files/verity-etc-mount.service
      destination: /etc/systemd/system/etc-mount.service
    - source: ../common/files/verity-etc-mount.sh
      destination: /usr/local/bin/etc-mount.sh
    - source: ../common/files/sudoers-wheel
      destination: /etc/sudoers.d/wheel
    - source: ../common/files/verity-root-container.service
      destination: /usr/lib/systemd/system/trident-container.service
    services:
      enable:
      - etc-mount
      - sshd
      - trident-container
  scripts:
    postCustomization:
    - interpreter: /bin/bash
      content:
        $include: ../common/scripts.yaml#/verity-create-web-directory
fragments:
- match:
    runtime: host
    distro: azl3
  config:
    os:
      hostname:
        $set: trident-verity-testimg
      packages:
        install:
          $set:
          - grub2-efi-binary-noprefix
          - curl
          - device-mapper
          - dosfstools
          - dracut-overlayfs
          - efibootmgr
          - iproute
          - iptables
          - lsof
          - lvm2
          - mdadm
          - netplan
          - openssh-server
          - systemd-udev
          - tpm2-tools
          - trident-service
          - veritysetup
          - vim
      additionalFiles:
        $set:
        - source: ../common/files/verity-etc-mount.service
          destination: /etc/systemd/system/etc-mount.service
        - source: ../common/files/verity-etc-mount.sh
          destination: /usr/local/bin/etc-mount.sh
        - source: ../common/files/sudoers-wheel
          destination: /etc/sudoers.d/wheel
        - source: ../common/files/use-grpc-client-commit.conf
          destination: /etc/systemd/system/trident.service.d/override.conf
      services:
        enable:
          $set:
          - etc-mount
          - sshd
          - trident
          - tridentd.socket
    scripts:
      postCustomization:
        $set:
        - interpreter: /bin/bash
          content:
            $include: ../common/scripts.yaml#/verity-debug-trident-service
        - interpreter: /bin/bash
          content:
            $include: ../common/scripts.yaml#/verity-create-web-directory
  rpmSources:
  - ../../../../bin/RPMS
- match:
    runtime: host
    distro: azl4
  config:
    storage:
      disks:
        $set:
        - partitionTableType: gpt
          maxSize: 5G
          partitions:
          - id: esp
            type: esp
            size: 32M
          - id: boot
            size: 1G
          - label: root
            id: root
            size: 2G
          - label: root-hash
            id: verityhash
            size: 128M
          - id: sysexts
            size: 1G
          - id: confexts
            size: 200M
          - id: var
            size: grow
    os:
      hostname:
        $set: trident-verity-testimg
      packages:
        remove:
          $set: []
        install:
          $set:
          - grub2-efi-x64
          - grub2-efi-x64-modules
          - grub2-tools
          - grub2-tools-efi
          - shim
          - curl
          - device-mapper
          - dosfstools
          - dracut
          - efibootmgr
          - iproute
          - iptables-nft
          - lsof
          - lvm2
          - mdadm
          - netplan
          - openssh-server
          - systemd-udev
          - tpm2-tools
          - trident-service
          - selinux-policy
          - veritysetup
          - vim
          - attr
          - sudo
          - openssh-clients
          - systemd-networkd
          - systemd-resolved
          - netplan-default-backend-networkd
      additionalFiles:
        $set:
        - source: ../common/files/verity-etc-mount.service
          destination: /etc/systemd/system/etc-mount.service
        - source: ../common/files/verity-etc-mount.sh
          destination: /usr/local/bin/etc-mount.sh
        - source: ../common/files/sudoers-wheel
          destination: /etc/sudoers.d/wheel
        - source: ../common/files/use-grpc-client-commit.conf
          destination: /etc/systemd/system/trident.service.d/override.conf
        - source: ../common/files/10-live-ethernet-dhcp.network
          destination: /usr/lib/systemd/network/10-live-ethernet-dhcp.network
      services:
        enable:
          $set:
          - etc-mount
          - sshd
          - trident
          - tridentd.socket
          - systemd-networkd
          - systemd-resolved
          - netplan-configure.service
    scripts:
      postCustomization:
        $set:
        - interpreter: /bin/bash
          content:
            $include: ../common/scripts.yaml#/verity-debug-trident-service
        - interpreter: /bin/bash
          content:
            $include: ../common/scripts.yaml#/verity-create-web-directory
        - interpreter: /bin/bash
          content:
            $include: ../common/scripts.yaml#/azl4-enable-trident-service
        - interpreter: /bin/bash
          content:
            $include: ../common/scripts.yaml#/azl4-rebuild-initrd
        - interpreter: /bin/bash
          content:
            $include: ../common/scripts.yaml#/azl4-strip-selinux-xattrs
    previewFeatures:
    - preview-distro-version
  rpmSources:
  - ../../../../bin/RPMS
  base:
    $set:
      path: ../../../../artifacts/azl4_minimal_os.vhdx
