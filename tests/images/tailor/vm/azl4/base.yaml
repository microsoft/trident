os:
  kernelCommandLine:
    extraCommandLine:
      $set:
        - console=tty0
        - console=tty1
        - console=ttyS0
        - net.ifnames=0
        - rd.debug
        - loglevel=6
        - log_buf_len=1M
        - systemd.journald.forward_to_console=1

scripts:
  postCustomization:
    $prepend:
      - path: scripts/post-install.sh
      - path: scripts/update-host-status.sh
      - path: scripts/azl4/enable-trident-service-azl4.sh
      - path: scripts/prepare-update-config.sh
