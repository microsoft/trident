previewFeatures:
  - preview-distro-version

os:
  kernelCommandLine:
    extraCommandLine:
      $set:
        - console=tty0
        - console=ttyS0
        - net.ifnames=0
        - rd.debug
        - loglevel=6
        - log_buf_len=1M
        - systemd.journald.forward_to_console=1
  # Replace the package object so AZL3-only removals cannot leak into AZL4.
  packages:
    $set:
      install:
        - attr
        - cryptsetup
        - curl
        - dnf5
        - efibootmgr
        - grub2-efi-x64
        - grub2-efi-x64-modules
        - grub2-tools
        - grub2-tools-efi
        - iproute
        - iptables-nft
        - jq
        - lsof
        - netplan
        - netplan-default-backend-networkd
        - openssh-clients
        - openssh-server
        - policycoreutils
        - selinux-policy
        - shim
        - sudo
        - systemd-networkd
        - systemd-resolved
        - vim
        - systemd-sysext
        - systemd-confext
        - systemd-dissect
        - trident-service
  services:
    enable:
      $set:
        - sshd
        - systemd-networkd
        - systemd-resolved
        - netplan-configure.service
        - trident
        - tridentd.socket
  additionalFiles:
    $set:
      - source: files/hostname-shim.sh
        destination: /usr/local/bin/hostname
        permissions: "755"
      - source: files/sudoers-wheel
        destination: /etc/sudoers.d/wheel
      - source: files/99-dhcp-eth0.network
        destination: /etc/systemd/network/99-dhcp-eth0.network
      - source: files/regen-sshd-keys.service
        destination: /etc/systemd/system/regen-sshd-keys.service

scripts:
  postCustomization:
    $set:
      - path: scripts/ssh-move-host-keys-azl4.sh
      - path: scripts/enable-regen-sshd-keys.sh
      - path: scripts/rebuild-initrd-azl4.sh
      - path: scripts/strip-selinux-xattrs.sh
