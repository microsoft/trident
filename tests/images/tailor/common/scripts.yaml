audit-directory: |-
  # Add the necessary directories for the audit logs so that auditd can start
  mkdir -p /var/log/audit
offline-initialize: |
  trident offline-initialize
vm-prepare-update-config: |-
  CONFIG_PATH=/var/lib/trident/update-config.yaml
  DOWNLOAD_URL_PREFIX="http://192.168.122.1:8000"

  cp /etc/trident/config.yaml $CONFIG_PATH
  cat <<EOF >> $CONFIG_PATH
  image:
    url: $DOWNLOAD_URL_PREFIX/regular.cosi
    sha384: ignored
  EOF
ssh-configure-host-keys: |
  # Move the SSH host keys off the read-only /etc directory, so that sshd can run.
  SSH_VAR_DIR="/srv/etc/ssh/"

  cat << EOF >> /etc/ssh/sshd_config

  HostKey $SSH_VAR_DIR/ssh_host_rsa_key
  HostKey $SSH_VAR_DIR/ssh_host_ecdsa_key
  HostKey $SSH_VAR_DIR/ssh_host_ed25519_key
  EOF
ssh-create-host-key-directory: |
  # Move the SSH host keys off the read-only /etc directory, so that sshd can run.
  SSH_VAR_DIR="/srv/etc/ssh/"
  mkdir -p "$SSH_VAR_DIR"
network-duid-link-layer: sed -i 's/#DUIDType=vendor/DUIDType=link-layer/' /etc/systemd/networkd.conf
azl4-enable-trident-service: |
  #!/bin/bash
  # Defensive enable of trident.service and tridentd.socket.
  #
  # AZL3 gets these via the trident-service RPM's %systemd_post scriptlet.
  # AZL4 now installs the trident-service RPM as well (the units ship with
  # the RPM, not via additionalFiles), and we *should* be able to rely on the
  # RPM scriptlet plus baseimg-grub-azl4.yaml's `services.enable:` stanza.
  # In practice, `services.enable` did not create the
  # multi-user.target.wants/trident.service symlink in MIC AZL4 builds
  # (build 1120959 showed multi-user.target reached but trident.service
  # never started post-reboot, leaving servicingState stuck at
  # ab-update-finalized). Until we figure out why, manually link the
  # units defensively.
  #
  # tridentd.socket gets the same treatment because (a) if services.enable
  # is unreliable for one unit, it's likely unreliable for the other, and
  # (b) storm-trident drives every update/commit/rollback through the
  # tridentd gRPC socket — a missing /run/trident/trident.sock at boot
  # would fail every subsequent storm-trident invocation in the test
  # pipeline.
  set -euxo pipefail

  mkdir -p /etc/systemd/system/multi-user.target.wants
  mkdir -p /etc/systemd/system/sockets.target.wants
  ln -sf /usr/lib/systemd/system/trident.service \
      /etc/systemd/system/multi-user.target.wants/trident.service
  ln -sf /usr/lib/systemd/system/tridentd.socket \
      /etc/systemd/system/sockets.target.wants/tridentd.socket

  # Belt and braces: log the enabled state for diagnostics. systemctl is-enabled
  # may fail inside MIC's chroot without a running dbus, so don't gate the
  # script on it.
  systemctl is-enabled trident.service 2>&1 || true
  systemctl is-enabled tridentd.socket 2>&1 || true
  ls -l /etc/systemd/system/multi-user.target.wants/trident.service || true
  ls -l /etc/systemd/system/sockets.target.wants/tridentd.socket || true
azl4-move-host-keys: |
  #!/bin/bash
  # AZL4-compatible variant of ssh-move-host-keys.sh.
  #
  # AZL3 sshd reads the main /etc/ssh/sshd_config and we appended HostKey
  # lines to it. AZL4 sshd 10.0+ supports drop-ins under /etc/ssh/sshd_config.d/
  # which is the cleaner approach.
  SSH_VAR_DIR="/var/srv/etc/ssh"
  mkdir -p /etc/ssh/sshd_config.d
  cat > /etc/ssh/sshd_config.d/50-trident-host-keys.conf <<EOC
  HostKey ${shellDollar}{SSH_VAR_DIR}/ssh_host_rsa_key
  HostKey ${shellDollar}{SSH_VAR_DIR}/ssh_host_ecdsa_key
  HostKey ${shellDollar}{SSH_VAR_DIR}/ssh_host_ed25519_key
  EOC
azl4-enable-regen-sshd-keys: |
  #!/bin/bash
  # regen-sshd-keys is a one-shot service that generates SSH host keys in
  # /var/srv on first boot. Enable it via wants symlink because the generic
  # `services.enable` in MIC config is reserved for systemd unit names that
  # come from packages, and our unit is delivered via additionalFiles.
  set -euo pipefail
  mkdir -p /etc/systemd/system/multi-user.target.wants
  ln -sf /etc/systemd/system/regen-sshd-keys.service \
    /etc/systemd/system/multi-user.target.wants/regen-sshd-keys.service
azl4-rebuild-initrd: |
  #!/bin/bash
  # Regenerate initrd with --no-hostonly so all storage drivers are
  # included, not just the ones MIC's build environment happens to need.
  #
  # Why: storm-trident's rollback test (tools/storm/utils/vm/qemu/qemu.go)
  # attaches the qcow2 to a virt-install VM with `bus=sata`. MIC builds
  # the qcow2 in a virtio-backed environment, so dracut's default
  # hostonly mode produces an initramfs with only virtio drivers. On a
  # SATA-backed boot, the initramfs can't find the root partition by
  # UUID and systemd hangs forever waiting for /dev/disk/by-uuid/<root>.
  #
  # Rebuilding with --no-hostonly bakes in ahci, ata_piix, sata_sil, etc.
  # along with virtio so the same qcow2 boots regardless of the bus type
  # the consumer chooses.
  #
  # Runs inside the MIC chroot where /sys and /proc are bind-mounted but
  # the host's SELinux is not loaded (MIC strips that), so dracut's
  # cp -a doesn't hit the security.selinux setxattr issue that bites in
  # AZL3 MOS during install (see strip-selinux-xattrs.sh for the parallel
  # write-up).

  set -euo pipefail

  # Find the kernel version installed in this image. We require exactly
  # one — `ls | head -1` would silently pick the wrong one if any future
  # AZL4 variant ships multiple (kernel + kernel-hyperv, extramodules-*,
  # etc.). Fail loudly rather than generate an initramfs for the wrong
  # kernel: the failure mode of that misstep is "boot hangs waiting for
  # /dev/disk/by-uuid/<root>", which is the exact bug this script is
  # meant to prevent.
  # nullglob so an empty/missing modules dir yields a zero-length array
  # (reaching the 0) arm below) instead of the literal glob pattern.
  shopt -s nullglob
  KVERS=( /usr/lib/modules/* )
  case ${shellDollar}{#KVERS[@]} in
      0)
          echo "ERROR: no kernel modules dir under /usr/lib/modules" >&2
          exit 1
          ;;
      1)
          KVER=$(basename "${shellDollar}{KVERS[0]}")
          ;;
      *)
          echo "ERROR: expected exactly one kernel under /usr/lib/modules, found:" >&2
          printf '  %s\n' "${shellDollar}{KVERS[@]}" >&2
          exit 1
          ;;
  esac
  echo "Regenerating initramfs for kernel $KVER with --no-hostonly"

  # `--no-hostonly` includes all storage modules; `--no-hostonly-cmdline`
  # prevents dracut from baking the build-host's /proc/cmdline parameters
  # into the initramfs (which would fight the qcow2's grub cmdline at
  # runtime); `--reproducible` keeps the output bit-stable across builds
  # so we can detect spurious regenerations.
  dracut \
      --no-hostonly \
      --no-hostonly-cmdline \
      --reproducible \
      --add-drivers "ahci ata_piix sata_sil sata_nv sata_via sd_mod" \
      --force \
      --kver "$KVER"

  echo "Regenerated initramfs:"
  ls -lh /boot/initramfs-*
azl4-strip-selinux-xattrs: |
  #!/bin/bash
  # Strip security.selinux xattrs from the image, not IC's mounted inputs.
  #
  # Background: AZL4's base VHDX is built by the upstream Azure Linux build
  # process with SELinux file labels baked in (e.g. system_u:object_r:lib_t:s0).
  # Even though this test image sets `selinux: mode: disabled`, MIC does not
  # strip the inherited xattrs — `mode: disabled` only controls boot-time
  # SELinux state.
  #
  # These labels become a problem when Trident installs this cosi from the
  # AZL3 MOS environment: MOS boots with selinux=1 enforcing=0, loads its
  # AZL3 policy, and dracut (running inside the chroot) tries to preserve
  # the AZL4 labels via cp -a. The MOS-side SELinux LSM validates the
  # context being written and rejects labels not in its policy. dracut
  # cascades through hundreds of "cp: setting attribute 'security.selinux':
  # Permission denied" errors, eventually fatally on dracut-install's ldd
  # step.
  #
  # Stripping the xattrs at cosi build time sidesteps this entirely:
  #   - During MIC build, SELinux is not loaded inside the chroot, so
  #     setfattr -x works without policy interference.
  #   - During Trident install in MOS, cp -a finds no security.selinux to
  #     preserve and skips the setxattr call.
  #   - On first boot of the installed AZL4 OS, files get auto-relabeled if
  #     SELinux is enabled (which our test config disables anyway).
  #
  # Once AZL4 is the install/target environment for everything (no AZL3 MOS
  # bridging it), this script can be removed.

  set -euo pipefail

  echo "Stripping security.selinux xattrs from rootfs..."

  # Walk every regular file, symlink, and directory across all filesystems
  # under /. `find -xdev` would skip separately-mounted filesystems like
  # `/boot` and `/var` that MIC commonly composes with — and `/boot`
  # specifically carries SELinux labels on the kernel image and initramfs,
  # which is exactly what dracut touches during AZL3 MOS install of the
  # AZL4 cosi. Prune virtual filesystems and IC's read-only config mount;
  # the latter belongs to the build host, not the target image.
  #
  # `setfattr` follows symlinks by default; `-h` makes it operate on the
  # symlink itself, which is what we want here.
  file_list=$(mktemp)
  trap 'rm -f -- "$file_list"' EXIT
  if ! find / \( -path /proc -o -path /sys -o -path /dev -o -path /run \
      -o -path /_imageconfigs \) -prune \
      -o \( -type f -o -type d -o -type l \) -print0 > "$file_list"; then
      echo "ERROR: failed to enumerate files for SELinux xattr stripping" >&2
      exit 1
  fi

  count=0
  fail_count=0
  while IFS= read -r -d '' f; do
      # Capture stderr so we can distinguish ENODATA ("no such attribute",
      # benign — nothing to strip) from real failures (EPERM, EOPNOTSUPP).
      err=$(setfattr -h -x security.selinux "$f" 2>&1 >/dev/null) || rc=$? && rc=${shellDollar}{rc:-0}
      if [ "$rc" -eq 0 ]; then
          count=$((count + 1))
      elif echo "$err" | grep -qE "No such attribute|Operation not supported"; then
          : # nothing to strip, expected for files without the xattr
      else
          fail_count=$((fail_count + 1))
          echo "setfattr failed on '$f': $err" >&2
      fi
      rc=0
  done < "$file_list"

  echo "Stripped security.selinux from ${shellDollar}{count} files/dirs"

  if [ "$fail_count" -gt 0 ]; then
      echo "ERROR: setfattr failed (non-ENODATA) on ${shellDollar}{fail_count} entries" >&2
      exit 1
  fi

  # Verify the strip actually took effect by scanning a representative set
  # of paths (rootfs, /boot if present, /usr/lib/systemd, /etc). Any
  # residual security.selinux means we missed something — fail loudly
  # rather than warning, since the whole point of the script is to leave
  # the image bare.
  sentinel_dirs=( "/etc" "/usr/lib/systemd" "/usr/bin" )
  if [ -d /boot ]; then
      sentinel_dirs+=( "/boot" )
  fi
  for d in "${shellDollar}{sentinel_dirs[@]}"; do
      if ! attrs=$(getfattr -R -m security.selinux "$d" 2>/dev/null); then
          echo "ERROR: failed to scan SELinux xattrs under '$d'" >&2
          exit 1
      fi
      if grep security.selinux >/dev/null <<< "$attrs"; then
          echo "ERROR: security.selinux xattr still present under '$d'" >&2
          getfattr -R -m security.selinux "$d" 2>/dev/null | head -10 >&2
          exit 1
      fi
  done
test-update-os-release-date: |-
  printf -v DATE '%(%Y%m%d)T' -1
  sed -i "s/VERSION=\".*\"/VERSION=\"$DATE\"/" /etc/os-release
installer-host-post-install: |-
  # Add the necessary directories for the audit logs so that auditd can start
  mkdir -p /var/log/audit

  # Use more intuitive path for the ISO mount
  ln -s -T /run/initramfs/live /trident_cdrom

  # Load the config from the CDROM so that the user can patch it
  if [ ! -d /etc/trident ]; then
      mkdir -p /etc/trident
  fi

  if [ "$1" != "stream-image-test" ]; then
      ln -s -T /trident_cdrom/trident-config.yaml /etc/trident/config.yaml

      if [ ! -d /etc/systemd/system/trident-install.service.d ]; then
          mkdir -p /etc/systemd/system/trident-install.service.d
      fi
      ln -s -T /trident_cdrom/trident-override.conf /etc/systemd/system/trident-install.service.d/override.conf
  else
      # The stream image test purposefully does not have /etc/trident/config.yaml, so remove
      # this condition from the systemd service to avoid it failing to start
      sed -i 's|ConditionPathExists=/etc/trident/config.yaml||' /usr/lib/systemd/system/trident-install.service
  fi

  # Ensure /etc/rcp-agent/ exists
  if [ ! -d /etc/rcp-agent ]; then
      mkdir -p /etc/rcp-agent
  fi

  # Link rcp-agent config from the ISO
  ln -s -T /trident_cdrom/rcp-agent.yaml /etc/rcp-agent/config.yaml
installer-container-post-install: |-
  # Add the necessary directories for the audit logs so that auditd can start
  mkdir -p /var/log/audit
  # Use more intuitive path for the ISO mount
  ln -s -T /run/initramfs/live /trident_cdrom

  # Load the config from the CDROM so that the user can patch it
  if [ ! -d /etc/trident ]; then
      mkdir /etc/trident
  fi
  ln -s -T /trident_cdrom/trident-config.yaml /etc/trident/config.yaml

  if [ ! -d /etc/systemd/system/trident-container.service.d ]; then
      mkdir /etc/systemd/system/trident-container.service.d
  fi
  ln -s -T /trident_cdrom/trident-override.conf /etc/systemd/system/trident-container.service.d/override.conf
azl3-load-containerd-selinux-fix: |
  #!/bin/bash
  # Load SELinux policy module that grants the 'map' permission on
  # container_runtime_t:file for container engines.  This fixes containerd
  # 2.2+ MountManager bbolt mmap() denials under enforcing mode.
  semodule -i /usr/share/selinux/packages/containerd-mmap-fix.cil
mos-post-install: |-
  # Use more intuitive path for the ISO mount
  ln -s /run/initramfs/live /trident_cdrom

  # Load the config from the CDROM so that the user can patch it
  if [ ! -d /etc/trident ]; then
      mkdir -p /etc/trident
  fi
  ln -s /trident_cdrom/trident-config.yaml /etc/trident/config.yaml

  # Ensure /etc/rcp-agent/ exists
  if [ ! -d /etc/rcp-agent ]; then
      mkdir -p /etc/rcp-agent
  fi

  # Link rcp-agent config from the ISO
  ln -s /trident_cdrom/rcp-agent.yaml /etc/rcp-agent/config.yaml

  # Compile and load Trident SELinux module (this is otherwise handled in trident.spec)
  cd /usr/share/selinux/packages/trident
  make -f /usr/share/selinux/devel/Makefile trident.pp
  semodule -i trident.pp
verity-debug-trident-service: |-
  #!/bin/bash

  sed -i 's/--verbosity INFO/--verbosity DEBUG/' /usr/lib/systemd/system/trident.service
verity-create-web-directory: |-
  # Create the web directory for testing
  mkdir -p /web

azl4-live-docker-vfs: |
  #!/bin/bash
  set -euxo pipefail

  # The live ISO cannot unpack overlay snapshotter whiteouts.
  # Use VFS only for this temporary installer, without changing SELinux.
  mkdir -p /etc/docker
  test ! -e /etc/docker/daemon.json
  cat > /etc/docker/daemon.json <<'JSON'
  {
    "storage-driver": "vfs",
    "features": {
      "containerd-snapshotter": false
    }
  }
  JSON

azl4-label-verity-files: |
  #!/bin/bash
  set -euxo pipefail

  # Runtime relabeling cannot repair executable labels on a verity root.
  # Label the writable image before its hash tree is produced.
  policy=$(find /etc/selinux/targeted/policy -maxdepth 1 -type f -name 'policy.*' -print | sort -V | tail -n 1)
  test -n "$policy"
  setfiles -F -m -c "$policy" \
      -e /dev -e /proc -e /sys -e /run -e /boot/efi \
      /etc/selinux/targeted/contexts/files/file_contexts /

azl4-separate-boot-bls: |
  #!/bin/bash
  set -euxo pipefail

  # /boot is a separate filesystem: GRUB paths are relative to its root.
  boot=/boot
  found=false
  for entry in "$boot"/loader/entries/*.conf; do
      test -f "$entry"
      found=true
      sed -E -i '/^[[:space:]]*(linux|initrd)[[:space:]]/s@([[:space:]])/boot/@\1/@g' "$entry"
      while read -r key paths; do
          case "$key" in
              linux|initrd)
                  for path in $paths; do
                      test -f "$boot$path"
                  done
                  ;;
          esac
      done < "$entry"
  done
  test "$found" = true
