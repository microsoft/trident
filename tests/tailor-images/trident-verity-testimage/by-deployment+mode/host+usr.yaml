config:
  os:
    hostname: trident-usrverity-testimg
    packages:
      install:
        - binutils
        - trident-service
        - trident-static-pcrlock-files
        - audit
        - selinux-policy-devel
    additionalFiles:
      - source: ../common/files/use-grpc-client-commit.conf
        destination: /etc/systemd/system/trident.service.d/override.conf
    services:
      enable:
        - trident
        - tridentd.socket
