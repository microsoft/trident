bootloader:
  resetType: hard-reset
selinux:
  mode: disabled
kernelCommandLine:
  extraCommandLine:
    - console=tty0
    - console=tty1
    - console=ttyS0
    - rd.debug
    - loglevel=6
    - log_buf_len=1M
    - systemd.journald.forward_to_console=1
packages:
  install:
    - curl
    - device-mapper
    - dnf
    - dracut-overlayfs
    - efibootmgr
    - grub2-efi-binary-noprefix
    - iproute
    - iptables
    - jq
    - kexec-tools
    - lsof
    - lvm2
    - netplan
    - openssh-server
    - systemd-udev
    - trident-service
    - veritysetup
    - vim
    - netplan
  remove:
    - grub2-efi-binary
additionalFiles:
  - source: base/files/etc-mount.service
    destination: /etc/systemd/system/etc-mount.service
  - source: base/files/etc-mount.sh
    destination: /usr/local/bin/etc-mount.sh
  - source: ../common/files/sudoers-wheel
    destination: /etc/sudoers.d/wheel
  - source: base/files/99-dhcp-eth0.network
    destination: /etc/systemd/network/99-dhcp-eth0.network
  - source: ../common/files/use-grpc-client-commit.conf
    destination: /etc/systemd/system/trident.service.d/override.conf
services:
  enable:
    - etc-mount
    - kdump
    - trident
    - tridentd.socket
users:
  - name: testuser
    sshPublicKeyPaths:
      - base/files/id_rsa.pub
    secondaryGroups:
      - wheel
