bootType: efi
disks:
  - partitionTableType: gpt
    maxSize: 5G
    partitions:
      - id: esp
        type: esp
        size: 8M
      - id: root
        size: 4G
filesystems:
  - deviceId: esp
    type: fat32
    mountPoint:
      path: /boot/efi
      options: umask=0077
  - deviceId: root
    type: ext4
    mountPoint: /
