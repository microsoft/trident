name: trident-vm-testimage

matrix:
  arch: [amd64, arm64]
  scenario: [grub, grub-base]

selectors:
  exclude:
    - { arch: arm64, scenario: [grub-base] }

base:
  ref: qemu_guest

outputs:
  - format: cosi

rpmSources:
  - ../../../bin/RPMS
  - ../../../artifacts/rpm-overrides

extraDependencies:
  - ./base
  - ../common

config: {}
