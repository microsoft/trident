name: trident-vm-testimage

matrix:
  arch: [amd64, arm64]
  scenario: [grub, grub-base, grub-verity, grub-verity-base, root-verity, usr-verity, acl-agent, acl-agent-base, grub-verity-azure, grub-verity-azure-base]

selectors:
  exclude:
    - { arch: arm64, scenario: [grub-base, grub-verity-base, root-verity, usr-verity, acl-agent, acl-agent-base, grub-verity-azure, grub-verity-azure-base] }

base:
  ref: qemu_guest

outputs:
  - format: cosi

rpmSources:
  - ../../../bin/RPMS
  - ../../../artifacts/rpm-overrides

extraDependencies:
  - ./base
  - ../common

config: {}
