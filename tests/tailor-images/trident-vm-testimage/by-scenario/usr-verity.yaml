outputs:
  $append:
    - format: qcow2
config:
  storage:
    $include: ./include/storage-usr-verity.yaml
  os:
    hostname: trident-vm-usr-verity-testimg
    additionalFiles:
      - source: base/files/99-dhcp-eth0.network
        destination: /etc/systemd/network/99-dhcp-eth0.network
      - source: ../common/files/sudoers-wheel
        destination: /etc/sudoers.d/wheel
    services:
      enable:
        - kdump
        - trident
        - tridentd.socket
