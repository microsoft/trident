outputs:
  $append:
    - format: vhd-fixed
base:
  $set:
    ref: core_selinux
config:
  storage:
    $include: ./include/storage-grub-verity.yaml
  os:
    hostname: trident-vm-testimg
    selinux:
      mode:
        $set: permissive
    packages:
      install:
        $remove:
          - netplan
        $append:
          - selinux-policy
          - WALinuxAgent
    users:
      $replace:
        - name: testuser
          secondaryGroups:
            - wheel
