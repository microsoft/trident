# Configuration for `cargo-about`, used to generate the top-level `NOTICE` file
# that carries the required attribution for the third-party OSS crates statically
# linked into the Trident binaries.
#
# `NOTICE` is checked in and regenerated in CI to detect drift (see the
# `update-notice` / `validate-notice` Makefile targets and the "Check Licenses"
# pipeline job). To regenerate locally after a dependency change, run:
#
#   make update-notice
#
# The accepted set below mirrors the licenses permitted by `deny.toml` — its
# `[licenses] allow` list plus any per-crate `exceptions` (e.g. Zlib for
# const_format). Keep the two in sync: a new license appearing in the tree must
# be vetted and added in both places.

# SPDX identifiers accepted for third-party crates. Keep in sync with deny.toml
# (its allow list plus per-crate exceptions).
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]

# Pin the target triples so the generated dependency graph — and therefore the
# NOTICE — is identical regardless of the host that runs the generation.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

# Test-only dependencies are never shipped, so they are excluded. Build
# dependencies are kept: build scripts and proc-macros can emit code that ends up
# in the final binary, so their licenses may still require attribution.
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# Drop first-party workspace crates (all `publish = false`): they are covered by
# the repository's own top-level LICENSE, not by third-party notices.
[private]
ignore = true

# Deterministic license selection for the zerocopy family.
#
# These crates are multi-licensed (`BSD-2-Clause OR Apache-2.0 OR MIT`) and ship
# all three license files. cargo-about's per-host harvesting resolves the `OR`
# expression to a different concrete MIT *text* on different hosts (dev vs CI),
# which moved `zerocopy` between two MIT groups and broke the checked-in-vs-CI
# `NOTICE` diff on every run. Pinning the license to MIT sourced from the crate's
# own `LICENSE-MIT` (identical bytes across all four family members, verified by
# the shared checksum below) makes the resolved text identical on every host.
# `render_notice.py` already de-dupes by exact text; this fixes the one input
# cargo-about itself produces non-deterministically.
[zerocopy.clarify]
license = "MIT"

[[zerocopy.clarify.files]]
path = "LICENSE-MIT"
checksum = "1a2f5c12ddc934d58956aa5dbdd3255fe55fd957633ab7d0d39e4f0daa73f7df"

[zerocopy-derive.clarify]
license = "MIT"

[[zerocopy-derive.clarify.files]]
path = "LICENSE-MIT"
checksum = "1a2f5c12ddc934d58956aa5dbdd3255fe55fd957633ab7d0d39e4f0daa73f7df"
