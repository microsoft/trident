name: Copilot Setup Steps

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - .cargo/config.toml
      - Makefile
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/copilot-setup-steps.yml
      - scripts/cloud-agent/ado-cargo-token.sh
      - scripts/cloud-agent/setup.sh
      - scripts/cloud-agent/validate.sh

jobs:
  # This job name is required by GitHub Copilot coding agent.
  copilot-setup-steps:
    runs-on: trident-github-runner-ubuntu2204-amd64
    timeout-minutes: 59
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.25.x"
          cache: false

      - name: Set up Trident dependencies
        env:
          ADO_UMI_CLIENT_ID: e2fd61e6-b160-4f02-a5ac-3d949a4fe01d
        run: scripts/cloud-agent/setup.sh
