name: Cloud agent runner smoke

permissions: {}

on:
  workflow_dispatch:
  push:
    branches:
      - user/britel/cloud-agent-runner-smoke
    paths:
      - .github/workflows/cloud-agent-runner-smoke.yml
      - scripts/cloud-agent/runner-smoke.sh

jobs:
  runner-smoke:
    name: Validate 1ES KVM runner
    runs-on:
      - self-hosted
      - 1ES.Pool=maritimus-github-runner-ubuntu2404-amd64
      - JobId=trident-cloud-agent-runner-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install virtualization prerequisites
        run: |
          set -eux

          sudo mkdir -p /etc/apt/apt.conf.d
          echo 'DPkg::Lock::Timeout "600";' | sudo tee -a /etc/apt/apt.conf.d/99lock-timeout

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvirt-clients \
            libvirt-daemon-system \
            ovmf \
            qemu-kvm \
            qemu-utils

          sudo systemctl restart libvirtd
          sudo systemctl status --no-pager libvirtd

      - name: Run KVM and libvirt smoke test
        run: |
          set -o pipefail
          log_dir="$RUNNER_TEMP/trident-cloud-agent-runner-smoke"
          mkdir -p "$log_dir"

          bash scripts/cloud-agent/runner-smoke.sh "$log_dir" \
            2>&1 | tee "$log_dir/runner-smoke.log"

      - name: Upload runner diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-agent-runner-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trident-cloud-agent-runner-smoke
          if-no-files-found: error
