name: One-off namespace VM prerequisite validation

on:
  push:
    branches:
      - user/britel/namespace-vm-validation-20261123

permissions:
  contents: read

concurrency:
  group: namespace-vm-validation
  cancel-in-progress: false

jobs:
  validate:
    # Parent must assign an exclusive disposable 1ES host before pushing reviewed code.
    runs-on: trident-github-runner-ubuntu2204-amd64
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ed0688f628ef5be84a6c06e555ed317ffd4ee49c
          path: candidate
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false

      - name: Run bounded prerequisite check
        timeout-minutes: 38
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/namespace-vm-reports"
          timeout --signal=INT --kill-after=30s 36m \
            python3 validation/scripts/cloud-agent/namespace-vm-validation.py \
            run "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/namespace-vm-reports"

      - name: Audit teardown and source even after failure
        if: always()
        timeout-minutes: 2
        run: |
          python3 validation/scripts/cloud-agent/namespace-vm-validation.py \
            audit "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/namespace-vm-reports"

      - name: Record job outcome
        if: always()
        env:
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/namespace-vm-reports"
          printf 'Candidate: ed0688f628ef5be84a6c06e555ed317ffd4ee49c\nHarness: %s\nStatus before upload: %s\n' \
            "$GITHUB_SHA" "$VALIDATION_STATUS" \
            | tee "$RUNNER_TEMP/namespace-vm-reports/workflow-status.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence only (no VM disk or recovery key)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: namespace-vm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/namespace-vm-reports/
          if-no-files-found: error
          retention-days: 7
