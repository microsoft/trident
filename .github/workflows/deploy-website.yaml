name: Deploy to GitHub Pages

on:
  # Manual trigger
  workflow_dispatch:

  # Triggers the workflow on push or pull request events but only for the main branch
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/deploy-website.yaml"

  # # Trigger on release
  # release:
  #   types: [published]
  #   branches: [main]

# Default to no permissions; each job grants only what it needs.
permissions: {}

jobs:
  build:
    name: Build Github Pages artifact
    runs-on: ubuntu-latest
    # Builds the website from (possibly untrusted PR) source. Needs only
    # read access to check out code; it must never hold contents/pages/
    # id-token write, since create_versioned_docs.sh, npm ci, and npm run
    # build all execute code from the PR being validated.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x

      - name: Build website
        run: |
          # Go to website folder
          cd website
          # Authenticate GitHub CLI
          echo ${{ secrets.GITHUB_TOKEN }} | gh auth login --with-token
          # For pull requests, use branch as dev version so branch docs are validated
          if [[ "${{github.event_name}}" == "pull_request" ]]; then
            # For external PRs, use the merge commit ref instead of the branch name
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
              export DEV_BRANCH="refs/pull/${{ github.event.number }}/merge"
              export USE_MERGE_COMMIT="true"
              echo "External PR detected. Using merge ref: $DEV_BRANCH"
            else
              export DEV_BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
              echo "Using PR branch as dev branch: $DEV_BRANCH"
            fi
          fi
          # Construct multi-version docs
          ./scripts/create_versioned_docs.sh
          # Install dependencies
          npm ci
          # Build website
          npm run build

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./website/build

  wait-for-approval:
    # Do not run publishing flow for pull requests
    if: github.event_name != 'pull_request'
    name: Wait for validation and approval
    # This job will require approval for the 'wait-for-approval' environment
    environment: wait-for-approval
    runs-on: ubuntu-latest
    needs: build
    # Only gates approval; needs no repo or deployment permissions.
    permissions: {}
    steps:
      - name: Approved
        run: |
          echo "approved :)"

  deploy:
    # Do not run publishing flow for pull requests
    if: github.event_name != 'pull_request'
    name: Deploy website artifact to Github Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: wait-for-approval
    # Only this job actually publishes to Pages; it needs pages:write to
    # call the deployment API and id-token:write to mint the OIDC token
    # actions/deploy-pages uses to authenticate that call.
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
