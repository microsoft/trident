# Lowest ring per configuration/runtime; higher rings include lower ones.
# Ring order: pr-e2e, ci, pre, full-validation.

base:
  vm:
    host: pr-e2e
    container: pr-e2e
combined:
  vm:
    host: pr-e2e
    container: pr-e2e
  isUki: true
