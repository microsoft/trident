# Synthetic test workspace (NOT a real config) — the workspace `defaults.outputs[].name`
# is unsafe (contains a path separator), which must be rejected at build_targets() time
# the same way an image-level outputs[].name is, since this value is never routed
# through render_cell's own validation when a cell has no image-level outputs.
schemaVersion: 1

toolchains:
  default: ic
  entries:
    - name: ic
      container: registry.example/imagecustomizer
      version: "1.0.0"

defaults:
  outputs:
    - format: cosi
      name: "escape/attempt"
