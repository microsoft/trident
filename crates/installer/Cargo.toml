[package]
name = "installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
publish = false
license = "MIT"

[[bin]]
name = "trident-installer"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
url = { workspace = true }

# Local Crate Dependencies
osutils = { path = "../osutils" }
trident-client = { path = "../trident-client", features = ["preview"] }
trident_api = { path = "../trident_api" }

[dev-dependencies]
indoc = { workspace = true }
tempfile = { workspace = true }
