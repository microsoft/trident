[package]
name = "trident-acl-agent"
version = "0.1.0"
edition = "2021"
publish = false

# One-shot Omaha/Nebraska update client ("legacy" flow): polls Nebraska
# once and, if an update is offered, calls tridentd's combined Update() RPC
# once and exits. No Kubernetes/annotation involvement. Ships with no
# systemd unit; configured entirely via TRIDENT_ACL_AGENT_* environment
# variables (see src/config.rs), same as before the split.

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
humantime = { workspace = true }
log = { workspace = true }
semver = { workspace = true }
systemd-journal-logger = { workspace = true }
tokio = { workspace = true }
url = { workspace = true, features = ["serde"] }

trident-agent-core = { path = "../trident-agent-core" }
trident-proto = { path = "../trident-proto" }
